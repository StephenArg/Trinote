name: TriliumMobile
options:
  bundleIdPrefix: com.trilium
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
    INFOPLIST_FILE: TriliumMobile/Resources/Info.plist
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Manual
    SWIFT_STRICT_CONCURRENCY: complete

targets:
  TriliumMobile:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: TriliumMobile
        excludes:
          - "**/*.xcassets/*/Contents.json"
    resources:
      - path: TriliumMobile/Resources/Assets.xcassets
      - path: TriliumMobile/Resources/editor-icons
      - path: TriliumMobile/Resources/editor-vendor
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.trilium.mobile
        INFOPLIST_FILE: TriliumMobile/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: false
    scheme:
      testTargets:
        - TriliumMobileTests

  TriliumMobileTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: TriliumMobileTests
    dependencies:
      - target: TriliumMobile
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.trilium.mobile.tests
        GENERATE_INFOPLIST_FILE: true
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/TriliumMobile.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/TriliumMobile"
        BUNDLE_LOADER: "$(TEST_HOST)"
