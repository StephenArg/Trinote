name: Trinote
options:
  bundleIdPrefix: com.trinote
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
    INFOPLIST_FILE: Trinote/Resources/Info.plist
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Manual
    SWIFT_STRICT_CONCURRENCY: complete

targets:
  Trinote:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Trinote
        excludes:
          - "**/*.xcassets/*/Contents.json"
          # npm deps are build-only; bundling them duplicates filenames (package.json, README.md, …) and breaks Copy Bundle Resources.
          - "**/Resources/editor-vendor/node_modules/**"
    resources:
      - path: Trinote/Resources/Assets.xcassets
      - path: Trinote/Resources/editor-icons
      # Bundle only vendored scripts at repo root — not node_modules (duplicate filenames break the build).
      - path: Trinote/Resources/editor-vendor
        excludes:
          - "node_modules"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.trinote
        INFOPLIST_FILE: Trinote/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: false
    scheme:
      testTargets:
        - TrinoteTests

  TrinoteTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: TrinoteTests
    dependencies:
      - target: Trinote
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.trinote.tests
        GENERATE_INFOPLIST_FILE: true
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Trinote.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Trinote"
        BUNDLE_LOADER: "$(TEST_HOST)"
