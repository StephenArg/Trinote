<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, user-scalable=yes">
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background: transparent; overflow: auto; }
    body { display: flex; align-items: center; justify-content: center; padding: 16px; }
    svg { max-width: 100%; height: auto; }
    #status { font-family: -apple-system, system-ui; color: #888; font-size: 15px;
              text-align: center; padding: 40px; }
    @media (prefers-color-scheme: dark) {
        #canvas-svg svg { filter: invert(0.88) hue-rotate(180deg); }
    }
</style>
</head>
<body>
<div id="status">Rendering canvas...</div>
<div id="canvas-svg" style="display:none;"></div>

<script type="module">
import { exportToSvg } from 'https://esm.sh/@excalidraw/utils@0.2?bundle';

window.canvasViewer = {
    async loadScene(jsonString) {
        const statusEl = document.getElementById('status');
        const svgEl = document.getElementById('canvas-svg');
        try {
            const data = JSON.parse(jsonString);
            const elements = data.elements || [];
            const files = {};

            if (data.files) {
                if (Array.isArray(data.files)) {
                    data.files.forEach(f => { if (f && f.id) files[f.id] = f; });
                } else {
                    Object.assign(files, data.files);
                }
            }

            const svg = await exportToSvg({
                elements: elements,
                files: files,
                appState: {
                    exportWithDarkMode: window.matchMedia('(prefers-color-scheme: dark)').matches,
                    viewBackgroundColor: 'transparent'
                },
                exportPadding: 20
            });

            statusEl.style.display = 'none';
            svgEl.style.display = 'flex';
            svgEl.appendChild(svg);

            window.webkit.messageHandlers.canvasRendered.postMessage(
                String(svg.getAttribute('height') || '400')
            );
        } catch (e) {
            statusEl.textContent = 'Could not render canvas: ' + e.message;
            console.error(e);
        }
    }
};

try {
    window.webkit.messageHandlers.canvasReady.postMessage('ready');
} catch(e) {}
</script>
</body>
</html>
