<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <!--
        viewport-fit=cover so the editor reaches under the home indicator on
        notched iPhones. maximum-scale + user-scalable disabled so the browser
        zoom gesture doesn't fight Univer's own pinch-to-zoom.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="stylesheet" href="univer-editor-assets/univer-bundle.css" />
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            background: var(--univer-bg-color, #ffffff);
            color-scheme: light;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            overscroll-behavior: none;
        }
        html.univer-dark, html.univer-dark body {
            background: #1c1c1e;
            color-scheme: dark;
        }
        body {
            /*
                touch-action:none lets Univer's mobile gesture controller
                receive raw touches (PR #6483 / MobileSheetsScrollRenderController)
                instead of the browser converting them to scroll/zoom first.
            */
            touch-action: none;
        }
        #app {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            overflow: hidden;
        }

        @media (prefers-color-scheme: dark) {
            html:not(.univer-dark) { color-scheme: light; }
        }

        /*
            After drag-fill, Univer shows a small autofill options chip (copy / series /
            format only / no format). Enlarge it on touch devices and always show the
            expand chevron — desktop relies on hover to reveal it.
        */
        @media (hover: none), (pointer: coarse) {
            .univer-z-10.univer-size-0 .univer-flex.univer-items-center.univer-gap-2 {
                min-height: 36px;
                min-width: 36px;
                padding: 8px 10px !important;
                border: 1px solid rgba(128, 128, 128, 0.35);
                border-radius: 8px;
                box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12);
            }
            .univer-z-10.univer-size-0 svg.univer-fill-primary-600 + svg {
                display: inline-block !important;
            }
        }
    </style>
</head>
<body>
    <div id="app"></div>
    <script src="univer-editor-assets/univer-bundle.js"></script>
</body>
</html>
