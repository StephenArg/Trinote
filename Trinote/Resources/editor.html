<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<style>
:root {
  --bg: #ffffff;
  --fg: #1c1c1e;
  --toolbar-bg: #f2f2f7;
  --toolbar-border: #c6c6c8;
  --btn-bg: transparent;
  --btn-active: #007aff;
  --btn-active-bg: rgba(0,122,255,0.12);
  --editor-bg: #ffffff;
  --border: #e5e5ea;
  --placeholder: #8e8e93;
  --popup-bg: #ffffff;
  --popup-shadow: rgba(0,0,0,0.15);
  --table-border: #d1d1d6;
  --icon-filter: brightness(0);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1c1c1e;
    --fg: #aaaaaa;
    --toolbar-bg: #2c2c2e;
    --toolbar-border: #38383a;
    --btn-active-bg: rgba(10,132,255,0.2);
    --btn-active: #0a84ff;
    --editor-bg: #1c1c1e;
    --border: #38383a;
    --placeholder: #636366;
    --popup-bg: #2c2c2e;
    --popup-shadow: rgba(0,0,0,0.4);
    --table-border: #48484a;
    --icon-filter: brightness(0) invert(0.67);
  }
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; background: var(--bg); color: var(--fg); font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif; }
body { display: flex; flex-direction: column; }

/* Toolbar — full natural height; horizontal scroll only inside the strip */
.toolbar-wrap {
  flex-shrink: 0; border-bottom: 1px solid var(--toolbar-border); background: var(--toolbar-bg);
  overflow-x: hidden; overflow-y: visible;
  /* Subpixel / WK clipping: avoid the first row of controls being sheared at the top */
  padding-top: 2px;
}
.toolbar {
  display: flex; flex-wrap: nowrap; align-items: center; gap: 1px;
  padding: 4px 6px;
  min-height: 42px;
  overflow-x: auto; overflow-y: visible;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior-y: none;
  touch-action: pan-x;
  -webkit-user-select: none;
  user-select: none;
}
.toolbar::-webkit-scrollbar { display: none; }
.toolbar button {
  flex-shrink: 0; border: none; background: var(--btn-bg);
  color: var(--fg); font-size: 15px; font-weight: 600;
  width: 36px; min-height: 34px; border-radius: 6px;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; -webkit-tap-highlight-color: transparent;
}
.toolbar button:active { opacity: 0.6; }
.toolbar button.active { color: var(--btn-active); background: var(--btn-active-bg); }
.toolbar button svg { width: 18px; height: 18px; fill: currentColor; }
.toolbar button img.icon { width: 18px; height: 18px; object-fit: contain; filter: var(--icon-filter); }
.toolbar button .toolbar-code-glyph {
  font-size: 12px;
  font-weight: 700;
  font-family: ui-monospace, "SF Mono", Menlo, monospace;
  letter-spacing: -0.12em;
  line-height: 1;
  user-select: none;
}
.toolbar .sep { width: 1px; height: 22px; background: var(--toolbar-border); margin: 0 3px; flex-shrink: 0; }
.toolbar select {
  flex-shrink: 0; border: 1px solid var(--border); background: var(--toolbar-bg);
  color: var(--fg); font-size: 13px; height: 34px; border-radius: 6px; padding: 0 6px;
  -webkit-appearance: none; appearance: none; cursor: pointer;
}

/* Color popup — fixed to viewport (appended to body) so toolbar overflow never clips or scrolls it */
.color-popup {
  display: none; position: fixed; left: 0; top: 0; z-index: 10000;
  background: var(--popup-bg); border: 1px solid var(--border); border-radius: 10px;
  padding: 8px; box-shadow: 0 4px 20px var(--popup-shadow);
  /* 7×30px swatches + gaps; avoids 0×0 first-paint layout on WKWebView */
  min-width: 248px;
  max-height: min(70vh, 420px); overflow-y: auto; -webkit-overflow-scrolling: touch;
}
.color-popup.visible { display: block; }
.color-grid { display: grid; grid-template-columns: repeat(7, 30px); gap: 4px; }
.color-swatch {
  width: 30px; height: 30px; border-radius: 6px; border: 2px solid transparent;
  cursor: pointer; -webkit-tap-highlight-color: transparent;
}
.color-swatch:active { opacity: 0.7; }
.color-swatch.clear-color { border: 2px solid var(--border); position: relative; }
.color-swatch.clear-color::after {
  content: ''; position: absolute; top: 50%; left: 0; width: 100%; height: 2px;
  background: red; transform: rotate(-45deg);
}

/* Editor area */
#editor-container { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; cursor: text; }
.tiptap {
  padding: 16px; outline: none; min-height: 100%; font-size: 16px; line-height: 1.6; color: var(--fg);
}
.tiptap p { margin: 0.4em 0; }
.tiptap h1 { font-size: 1.8em; margin: 0.6em 0 0.3em; }
.tiptap h2 { font-size: 1.5em; margin: 0.5em 0 0.3em; }
.tiptap h3 { font-size: 1.3em; margin: 0.5em 0 0.3em; }
.tiptap h4 { font-size: 1.15em; margin: 0.4em 0 0.2em; }
.tiptap h5 { font-size: 1.05em; margin: 0.4em 0 0.2em; }
.tiptap h6 { font-size: 1em; margin: 0.4em 0 0.2em; }
.tiptap ul, .tiptap ol { padding-left: 24px; }
.tiptap ul[data-type="taskList"] { list-style: none; padding-left: 4px; }
/* Use > li (not [data-type=taskItem]) so every task row keeps checkbox + text on one line */
.tiptap ul[data-type="taskList"] > li {
  display: flex;
  align-items: flex-start;
  gap: 8px;
}
.tiptap ul[data-type="taskList"] > li > label {
  flex-shrink: 0;
  /* Slightly lower than before (was 3px) so checkbox lines up with first line of text */
  margin-top: 5px;
}
.tiptap ul[data-type="taskList"] > li > label input[type="checkbox"] {
  margin: 0;
  vertical-align: top;
  accent-color: var(--btn-active);
  cursor: pointer;
}
/* TipTap puts copy in div > p; dropping first-p top margin avoids text sitting low vs checkbox */
.tiptap ul[data-type="taskList"] > li > div > p:first-child { margin-top: 0; }
.tiptap ul[data-type="taskList"] > li > p:first-child { margin-top: 0; }
.tiptap blockquote { border-left: 4px solid var(--border); margin: 0.5em 0; padding: 4px 16px; opacity: 0.85; }
.tiptap pre { background: rgba(128,128,128,0.1); padding: 12px; border-radius: 8px; overflow-x: auto; font-size: 14px; font-family: "SF Mono", Menlo, monospace; }
.tiptap code { background: rgba(128,128,128,0.1); padding: 2px 6px; border-radius: 4px; font-size: 14px; font-family: "SF Mono", Menlo, monospace; }
.tiptap pre code { background: none; padding: 0; }
.tiptap img { max-width: 100%; height: auto; border-radius: 6px; }
.tiptap hr { border: none; border-top: 2px solid var(--border); margin: 1em 0; }
.tiptap a { color: var(--btn-active); text-decoration: underline; }
/* TipTap Highlight → <mark>; ensure multicolor backgrounds paint (esp. WebKit / line wraps) */
.tiptap mark {
  -webkit-box-decoration-break: clone;
  box-decoration-break: clone;
  border-radius: 2px;
  padding: 0.05em 0;
}
.tiptap table { border-collapse: collapse; width: 100%; margin: 0.5em 0; }
.tiptap th, .tiptap td { border: 1px solid var(--table-border); padding: 6px 10px; min-width: 60px; vertical-align: top; }
.tiptap th { background: rgba(128,128,128,0.08); font-weight: 600; }
.tiptap .selectedCell { background: var(--btn-active-bg); }
.tiptap p.is-editor-empty:first-child::before {
  content: attr(data-placeholder); color: var(--placeholder); float: left; height: 0; pointer-events: none;
}

/* Loading state */
#loading { display: flex; align-items: center; justify-content: center; height: 100%; color: var(--placeholder); font-size: 15px; }
</style>
</head>
<body>

<div class="toolbar-wrap" id="toolbar-wrap" style="display:none">
<div class="toolbar" id="toolbar"></div>
</div>
<div id="editor-container">
  <div id="loading">Loading editor…</div>
  <div id="editor" style="display:none"></div>
</div>

<script src="tiptap-bundle.min.js"></script>
<script>
const { Editor, StarterKit, Underline, TextAlign, Color, TextStyle, Highlight, Table, TableRow, TableCell, TableHeader, Link, TaskList, TaskItem, Placeholder, Subscript, Superscript, Image } = TipTap;

const COLORS = [
  '#000000','#434343','#666666','#999999','#b7b7b7','#cccccc','#ffffff',
  '#980000','#ff0000','#ff9900','#ffff00','#00ff00','#00ffff','#0000ff',
  '#9900ff','#ff00ff','#e6b8af','#f4cccc','#fce5cd','#fff2cc','#d9ead3',
  '#d0e0e3','#cfe2f3','#d9d2e9','#ead1dc',
];

let _contentTimer = null;
let _toolbarScheduled = false;

const editor = new Editor({
  element: document.getElementById('editor'),
  extensions: [
    StarterKit.configure({ heading: { levels: [1,2,3,4,5,6] } }),
    Underline,
    TextStyle,
    Color,
    Highlight.configure({ multicolor: true }),
    TextAlign.configure({ types: ['heading','paragraph'] }),
    Table.configure({ resizable: false }),
    TableRow,
    TableCell,
    TableHeader,
    Link.configure({ openOnClick: false, HTMLAttributes: { rel: null, target: null } }),
    TaskList,
    TaskItem.configure({ nested: true }),
    Placeholder.configure({ placeholder: 'Start writing…' }),
    Subscript,
    Superscript,
    Image.configure({ inline: true, allowBase64: true, HTMLAttributes: { class: '' } }),
  ],
  content: '',
  onUpdate({ editor }) {
    clearTimeout(_contentTimer);
    _contentTimer = setTimeout(() => {
      try { window.webkit.messageHandlers.contentChanged.postMessage(tiptapToCk(editor.getHTML())); } catch(e) {}
    }, 300);
  },
  onSelectionUpdate() { scheduleToolbarUpdate(); },
  onTransaction() { scheduleToolbarUpdate(); },
});

// WKWebView / iOS: tapping the toolbar blurs the editor and collapses the DOM selection.
// Keep the last ProseMirror ranged selection so color / highlight pickers can still apply.
let editorSavedRange = null;
editor.on('selectionUpdate', ({ editor }) => {
  const { from, to, empty } = editor.state.selection;
  if (!empty) editorSavedRange = { from, to };
});

// iOS: while the swatch panel is open, blur refocuses the editor so the keyboard can stay up.
// IMPORTANT: Do not refocus on a timer/hold — that runs when tapping the color *button* (before the
// panel is visible) and steals the tap so the synthetic click never opens the picker.
function refocusEditorIfNeeded() {
  if (!document.querySelector('.color-popup.visible')) return;
  requestAnimationFrame(() => {
    try {
      if (editor.view && editor.view.dom) {
        editor.view.dom.focus({ preventScroll: true });
      }
    } catch (e) {}
  });
}
editor.view.dom.addEventListener('blur', refocusEditorIfNeeded);

// --- Toolbar Setup ---
const toolbar = document.getElementById('toolbar');
function ic(name) { return '<img class="icon" src="' + name + '" width="18" height="18" alt="" />'; }
function codeInlineGlyph() {
  return '<span class="toolbar-code-glyph" aria-hidden="true">&lt;/&gt;</span>';
}
function btn(title, icon, action, isActive) {
  const b = document.createElement('button');
  b.title = title; b.innerHTML = icon;
  b.addEventListener('click', (e) => { e.preventDefault(); action(); });
  b._isActive = isActive || (() => false);
  toolbar.appendChild(b);
  return b;
}
function sep() { const s = document.createElement('div'); s.className='sep'; toolbar.appendChild(s); }
function heading() {
  const sel = document.createElement('select');
  sel.title = 'Block type';
  ['Paragraph','H1','H2','H3','H4','H5','H6'].forEach((label, i) => {
    const o = document.createElement('option'); o.value = i; o.textContent = label; sel.appendChild(o);
  });
  sel.addEventListener('change', () => {
    const v = parseInt(sel.value);
    if (v === 0) editor.chain().focus().setParagraph().run();
    else editor.chain().focus().toggleHeading({ level: v }).run();
  });
  sel._updateState = () => {
    for (let l = 1; l <= 6; l++) { if (editor.isActive('heading', { level: l })) { sel.value = l; return; } }
    sel.value = 0;
  };
  toolbar.appendChild(sel);
  return sel;
}

// Text formatting
btn('Bold', ic('foundation--bold.svg'), () => editor.chain().focus().toggleBold().run(), () => editor.isActive('bold'));
btn('Italic', ic('foundation--italic.svg'), () => editor.chain().focus().toggleItalic().run(), () => editor.isActive('italic'));
btn('Underline', ic('foundation--underline.svg'), () => editor.chain().focus().toggleUnderline().run(), () => editor.isActive('underline'));
btn('Strike', ic('foundation--strikethrough.svg'), () => editor.chain().focus().toggleStrike().run(), () => editor.isActive('strike'));
btn('Code', codeInlineGlyph(), () => editor.chain().focus().toggleCode().run(), () => editor.isActive('code'));
btn('Superscript', ic('foundation--superscript.svg'), () => editor.chain().focus().toggleSuperscript().run(), () => editor.isActive('superscript'));
btn('Subscript', ic('foundation--subscript.svg'), () => editor.chain().focus().toggleSubscript().run(), () => editor.isActive('subscript'));
sep();

// Headings
const headingSel = heading();
sep();

// Lists
btn('Bullet list', ic('foundation--list-bullet.svg'), () => editor.chain().focus().toggleBulletList().run(), () => editor.isActive('bulletList'));
btn('Ordered list', ic('foundation--list-number.svg'), () => editor.chain().focus().toggleOrderedList().run(), () => editor.isActive('orderedList'));
btn('Task list', ic('foundation--list-thumbnails.svg'), () => editor.chain().focus().toggleTaskList().run(), () => editor.isActive('taskList'));
sep();

// Alignment
btn('Left', ic('foundation--align-left.svg'), () => editor.chain().focus().setTextAlign('left').run(), () => editor.isActive({ textAlign:'left' }));
btn('Center', ic('foundation--align-center.svg'), () => editor.chain().focus().setTextAlign('center').run(), () => editor.isActive({ textAlign:'center' }));
btn('Right', ic('foundation--align-right.svg'), () => editor.chain().focus().setTextAlign('right').run(), () => editor.isActive({ textAlign:'right' }));
btn('Justify', ic('foundation--align-justify.svg'), () => editor.chain().focus().setTextAlign('justify').run(), () => editor.isActive({ textAlign:'justify' }));
sep();

// Indent
btn('Outdent', ic('foundation--indent-less.svg'), () => { if(editor.isActive('bulletList')||editor.isActive('orderedList')||editor.isActive('taskList')) editor.chain().focus().liftListItem('listItem').run(); }, () => false);
btn('Indent', ic('foundation--indent-more.svg'), () => { if(editor.isActive('bulletList')||editor.isActive('orderedList')||editor.isActive('taskList')) editor.chain().focus().sinkListItem('listItem').run(); }, () => false);
sep();

// Color pickers — restore range before applying marks (see editorSavedRange above).
// After applying a mark, scroll the selection into the area visible above the keyboard (visualViewport).
function scrollEditorRangeIntoView() {
  const ec = document.getElementById('editor-container');
  const view = editor.view;
  if (!ec || !view) return;
  const { from, to } = editor.state.selection;
  let topDoc, bottomDoc;
  try {
    const c1 = view.coordsAtPos(from);
    const c2 = view.coordsAtPos(to);
    topDoc = Math.min(c1.top, c2.top, c1.bottom, c2.bottom);
    bottomDoc = Math.max(c1.top, c2.top, c1.bottom, c2.bottom);
  } catch (e) {
    return;
  }
  const pad = 12;
  const ecRect = ec.getBoundingClientRect();
  let visibleTop = ecRect.top + pad;
  let visibleBottom = ecRect.bottom - pad;
  const vv = window.visualViewport;
  if (vv) {
    const vTop = vv.offsetTop + pad;
    const vBottom = vv.offsetTop + vv.height - pad;
    visibleTop = Math.max(visibleTop, vTop);
    visibleBottom = Math.min(visibleBottom, vBottom);
  }
  if (visibleBottom <= visibleTop) return;

  if (topDoc < visibleTop) {
    ec.scrollTop += topDoc - visibleTop;
  } else if (bottomDoc > visibleBottom) {
    ec.scrollTop += bottomDoc - visibleBottom;
  }
}

function afterColorMarkEdit() {
  const dom = editor.view && editor.view.dom;
  if (dom) {
    try {
      dom.focus({ preventScroll: true });
    } catch (e) {
      dom.focus();
    }
  }
  const bump = () => scrollEditorRangeIntoView();
  bump();
  requestAnimationFrame(() => {
    bump();
    requestAnimationFrame(bump);
  });
  setTimeout(bump, 80);
  setTimeout(bump, 250);
  setTimeout(bump, 450);
}

function withColorMarkEdit(editFn) {
  editFn();
  afterColorMarkEdit();
}

function colorPickerApplyRange(wrapper) {
  const sel = editor.state.selection;
  if (!sel.empty) return { from: sel.from, to: sel.to };
  if (wrapper._rangeAtOpen && wrapper._rangeAtOpen.from !== wrapper._rangeAtOpen.to)
    return wrapper._rangeAtOpen;
  if (editorSavedRange && editorSavedRange.from !== editorSavedRange.to)
    return editorSavedRange;
  return null;
}

const COLOR_POPUP_OUTSIDE_GRACE_MS = 450;
const COLOR_POPUP_SCROLL_GRACE_MS = 500;

function hideColorPopup(popup) {
  popup.classList.remove('visible');
  popup.style.left = '';
  popup.style.top = '';
  popup.style.visibility = '';
  popup._ignoreOutsideUntil = 0;
  popup._ignoreScrollUntil = 0;
}

function markColorPopupJustOpened(popup) {
  const t = performance.now();
  popup._ignoreOutsideUntil = t + COLOR_POPUP_OUTSIDE_GRACE_MS;
  popup._ignoreScrollUntil = t + COLOR_POPUP_SCROLL_GRACE_MS;
}

function layoutColorPopup(anchor, popup) {
  if (!popup.classList.contains('visible')) return;
  popup.style.visibility = 'hidden';
  popup.style.left = '0px';
  popup.style.top = '0px';
  const pr = popup.getBoundingClientRect();
  const ar = anchor.getBoundingClientRect();
  const margin = 8;
  let top = ar.bottom + 4;
  let left = ar.left;
  const pw = Math.max(pr.width, 1);
  const ph = Math.max(pr.height, 1);
  left = Math.max(margin, Math.min(left, window.innerWidth - pw - margin));
  if (top + ph > window.innerHeight - margin) {
    top = Math.max(margin, ar.top - ph - 4);
  }
  popup.style.left = `${Math.round(left)}px`;
  popup.style.top = `${Math.round(top)}px`;
  popup.style.visibility = '';
}

function makeColorPicker(title, icon, applyRangeFn, clearRangeFn) {
  const wrapper = document.createElement('div');
  wrapper.style.display = 'inline-flex';
  const b = document.createElement('button');
  b.type = 'button';
  b.title = title; b.innerHTML = icon;
  b.style.cssText = 'flex-shrink:0;border:none;background:var(--btn-bg);color:var(--fg);font-size:15px;font-weight:600;width:36px;height:34px;border-radius:6px;display:flex;align-items:center;justify-content:center;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation;';
  const popup = document.createElement('div');
  popup.className = 'color-popup';
  popup._anchorButton = b;
  const grid = document.createElement('div');
  grid.className = 'color-grid';
  const clearBtn = document.createElement('div');
  clearBtn.className = 'color-swatch clear-color';
  clearBtn.title = 'Remove color';
  clearBtn.style.touchAction = 'manipulation';
  function runClear(e) {
    e.preventDefault();
    e.stopPropagation();
    const r = colorPickerApplyRange(wrapper);
    hideColorPopup(popup);
    if (!r) return;
    clearRangeFn(r.from, r.to);
  }
  clearBtn.addEventListener('pointerdown', runClear, true);
  clearBtn.addEventListener('click', (e) => { e.preventDefault(); e.stopPropagation(); });
  grid.appendChild(clearBtn);
  COLORS.forEach(c => {
    const sw = document.createElement('div');
    sw.className = 'color-swatch';
    sw.style.background = c;
    sw.style.touchAction = 'manipulation';
    function runApply(e) {
      e.preventDefault();
      e.stopPropagation();
      const r = colorPickerApplyRange(wrapper);
      hideColorPopup(popup);
      if (!r) return;
      applyRangeFn(r.from, r.to, c);
    }
    sw.addEventListener('pointerdown', runApply, true);
    sw.addEventListener('click', (e) => { e.preventDefault(); e.stopPropagation(); });
    grid.appendChild(sw);
  });
  popup.appendChild(grid);
  document.body.appendChild(popup);
  b.addEventListener('pointerdown', () => {
    const { from, to } = editor.state.selection;
    wrapper._rangeAtOpen = { from, to };
  }, true);
  b.addEventListener('click', (e) => {
    e.preventDefault();
    e.stopPropagation();
    const willOpen = !popup.classList.contains('visible');
    document.querySelectorAll('.color-popup.visible').forEach(p => { if (p !== popup) hideColorPopup(p); });
    if (willOpen) {
      markColorPopupJustOpened(popup);
      popup.classList.add('visible');
      // Two rAFs: first layout pass can report 0×0 for the grid on iOS WKWebView
      requestAnimationFrame(() => {
        layoutColorPopup(b, popup);
        requestAnimationFrame(() => layoutColorPopup(b, popup));
      });
    } else {
      hideColorPopup(popup);
    }
  });
  wrapper.appendChild(b);
  toolbar.appendChild(wrapper);
  document.addEventListener('click', (e) => {
    if (!popup.classList.contains('visible')) return;
    if (performance.now() < (popup._ignoreOutsideUntil || 0)) return;
    if (!wrapper.contains(e.target) && !popup.contains(e.target)) hideColorPopup(popup);
  });
}

(function attachColorPopupDismiss() {
  const ec = document.getElementById('editor-container');
  if (!ec) return;
  ec.addEventListener('scroll', () => {
    document.querySelectorAll('.color-popup.visible').forEach(popup => {
      if (performance.now() < (popup._ignoreScrollUntil || 0)) return;
      hideColorPopup(popup);
    });
  }, { passive: true });
  window.addEventListener('resize', () => {
    document.querySelectorAll('.color-popup.visible').forEach(popup => {
      const anchor = popup._anchorButton;
      if (anchor) layoutColorPopup(anchor, popup);
    });
  });
})();

makeColorPicker('Text color', ic('foundation--text-color.svg'),
  (from, to, c) => {
    withColorMarkEdit(() => {
      editor.chain().setTextSelection({ from, to }).setColor(c).run();
    });
  },
  (from, to) => {
    withColorMarkEdit(() => {
      editor.chain().setTextSelection({ from, to }).unsetColor().run();
    });
  });
makeColorPicker('Background', ic('foundation--background-color.svg'),
  (from, to, c) => {
    withColorMarkEdit(() => {
      editor.chain().setTextSelection({ from, to }).setHighlight({ color: c }).run();
    });
  },
  (from, to) => {
    withColorMarkEdit(() => {
      editor.chain().setTextSelection({ from, to }).unsetHighlight().run();
    });
  });
sep();

// Insert
btn('Link', ic('foundation--link.svg'), () => {
  if (editor.isActive('link')) { editor.chain().focus().unsetLink().run(); return; }
  const url = prompt('Enter URL:');
  if (url) editor.chain().focus().extendMarkRange('link').setLink({ href: url }).run();
}, () => editor.isActive('link'));
btn('Table', ic('grid-1524-svgrepo-com.svg'), () => editor.chain().focus().insertTable({ rows: 3, cols: 3, withHeaderRow: true }).run(), () => false);
btn('Rule', '—', () => editor.chain().focus().setHorizontalRule().run(), () => false);
btn('Quote', ic('foundation--quote.svg'), () => editor.chain().focus().toggleBlockquote().run(), () => editor.isActive('blockquote'));
btn('Code block', ic('brackets-curly-fill-svgrepo-com.svg'), () => editor.chain().focus().toggleCodeBlock().run(), () => editor.isActive('codeBlock'));
btn('Image', ic('foundation--photo.svg'), () => {
  try { window.webkit.messageHandlers.pickImage.postMessage('pick'); } catch(e) {}
}, () => false);
sep();

// Undo/Redo

function scheduleToolbarUpdate() {
  if (_toolbarScheduled) return;
  _toolbarScheduled = true;
  requestAnimationFrame(() => {
    updateToolbarState();
    setTimeout(() => { _toolbarScheduled = false; }, 95);
  });
}

function updateToolbarState() {
  toolbar.querySelectorAll('button').forEach(b => {
    if (b._isActive) b.classList.toggle('active', b._isActive());
  });
  toolbar.querySelectorAll('select').forEach(s => { if (s._updateState) s._updateState(); });
}

// --- CKEditor ↔ TipTap HTML conversion ---
//
// CKEditor:  <ul class="todo-list"><li>
//              <label class="todo-list__label">
//                <input type="checkbox" disabled [checked]>
//                <span class="todo-list__label__description">text</span>
//              </label></li></ul>
//
// TipTap getHTML():  <ul data-type="taskList"><li data-type="taskItem" data-checked="false">
//                      <label><input type="checkbox"><span></span></label>
//                      <div><p>text</p></div></li></ul>
//
// TipTap setContent() expects:  <ul data-type="taskList">
//                                 <li data-type="taskItem" data-checked="false">text</li></ul>

// CKEditor / Trilium often use <span style="background-color:…">; TipTap Highlight expects <mark data-color>.
function migrateCkColorMarkupForTiptap(doc) {
  const body = doc.body;
  const spans = Array.from(body.querySelectorAll('span[style]')).reverse();
  spans.forEach(span => {
    if (!span.parentNode) return;
    const style = span.getAttribute('style') || '';
    const bgMatch = style.match(/background-color\s*:\s*([^;]+)/i);
    if (!bgMatch) return;
    const d = span.ownerDocument;
    const mark = d.createElement('mark');
    const bgVal = bgMatch[1].trim();
    mark.style.backgroundColor = bgVal;
    mark.setAttribute('data-color', bgVal);
    const colorMatch = style.match(/(?:^|;)\s*color\s*:\s*([^;]+)/i);
    if (colorMatch) {
      const inner = d.createElement('span');
      inner.setAttribute('style', 'color: ' + colorMatch[1].trim());
      while (span.firstChild) inner.appendChild(span.firstChild);
      mark.appendChild(inner);
    } else {
      while (span.firstChild) mark.appendChild(span.firstChild);
    }
    span.parentNode.replaceChild(mark, span);
  });
}

// TipTap saves <mark>; convert back to spans for CKEditor-compatible HTML / Trilium desktop.
function tiptapMarkToCkSpans(doc) {
  doc.querySelectorAll('mark').forEach(mark => {
    if (!mark.parentNode) return;
    const span = doc.createElement('span');
    const dc = mark.getAttribute('data-color');
    const st = mark.getAttribute('style') || '';
    const bgMatch = st.match(/background-color\s*:\s*([^;]+)/i);
    const bg = (dc || (bgMatch ? bgMatch[1].trim() : '')).trim();
    if (bg) span.style.backgroundColor = bg;
    while (mark.firstChild) span.appendChild(mark.firstChild);
    mark.parentNode.replaceChild(span, mark);
  });
}

function ckToTiptap(html) {
  if (!html) return html;
  const doc = new DOMParser().parseFromString(html, 'text/html');

  doc.querySelectorAll('ul.todo-list').forEach(ul => {
    ul.removeAttribute('class');
    ul.setAttribute('data-type', 'taskList');

    ul.querySelectorAll(':scope > li').forEach(li => {
      const cb = li.querySelector('input[type="checkbox"]');
      const checked = cb && cb.hasAttribute('checked') ? 'true' : 'false';
      li.setAttribute('data-type', 'taskItem');
      li.setAttribute('data-checked', checked);

      const desc = li.querySelector('.todo-list__label__description');
      const textHTML = desc ? desc.innerHTML : '';

      // Strip the entire CKEditor label; leave only plain inline text for TipTap to parse
      const label = li.querySelector('label.todo-list__label');
      if (label) label.remove();
      li.innerHTML = textHTML;
    });
  });

  migrateCkColorMarkupForTiptap(doc);
  return doc.body.innerHTML;
}

function tiptapToCk(html) {
  if (!html) return html;
  const doc = new DOMParser().parseFromString(html, 'text/html');

  tiptapMarkToCkSpans(doc);

  doc.querySelectorAll('ul[data-type="taskList"]').forEach(ul => {
    ul.removeAttribute('data-type');
    ul.classList.add('todo-list');

    ul.querySelectorAll(':scope > li[data-type="taskItem"]').forEach(li => {
      const checked = li.getAttribute('data-checked') === 'true';
      li.removeAttribute('data-type');
      li.removeAttribute('data-checked');

      // Extract only the real text, stripping TipTap's own <label> and <div><p> wrappers
      const tiptapLabel = li.querySelector(':scope > label');
      if (tiptapLabel) tiptapLabel.remove();

      // Unwrap <div><p>text</p></div> → just "text"
      let textHTML = '';
      const contentDiv = li.querySelector(':scope > div');
      if (contentDiv) {
        const p = contentDiv.querySelector('p');
        textHTML = p ? p.innerHTML : contentDiv.innerHTML;
      } else {
        // Fallback: strip any remaining <p> wrappers
        const p = li.querySelector(':scope > p');
        textHTML = p ? p.innerHTML : li.innerHTML;
      }

      // Rebuild in CKEditor format
      const label = doc.createElement('label');
      label.className = 'todo-list__label';

      const cb = doc.createElement('input');
      cb.type = 'checkbox';
      cb.disabled = true;
      if (checked) cb.setAttribute('checked', 'checked');

      const span = doc.createElement('span');
      span.className = 'todo-list__label__description';
      span.innerHTML = textHTML;

      label.appendChild(cb);
      label.appendChild(span);
      li.innerHTML = '';
      li.appendChild(label);
    });
  });

  return doc.body.innerHTML;
}

// --- Bridge ---
window.editorBridge = {
  setContent(html) { editor.commands.setContent(ckToTiptap(html) || '', false); },
  getContent() {
    clearTimeout(_contentTimer);
    return tiptapToCk(editor.getHTML());
  },
  focus() { editor.commands.focus('end'); },
  insertHTML(html) { editor.commands.insertContent(html); },
  insertImage(src) { editor.chain().focus().setImage({ src }).run(); },
};

// Show editor, hide loading
document.getElementById('loading').style.display = 'none';
document.getElementById('editor').style.display = 'block';
document.getElementById('toolbar-wrap').style.display = 'block';
updateToolbarState();

// First tap while unfocused: move caret to end and show keyboard. After that, let taps place the caret normally.
function editorDocumentHasFocus() {
  if (editor.isFocused === true) return true;
  try {
    return editor.view != null && editor.view.hasFocus();
  } catch (e) {
    return false;
  }
}
document.getElementById('editor-container').addEventListener('click', function(e) {
  if (e.target.closest('a[href]')) return;
  if (editorDocumentHasFocus()) return;
  e.preventDefault();
  e.stopPropagation();
  editor.commands.focus('end');
}, true);

try { window.webkit.messageHandlers.editorReady.postMessage('ready'); } catch(e) {}
