<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1c1c1e" media="(prefers-color-scheme: dark)">
<style>
:root {
  --bg: #ffffff;
  --fg: #1c1c1e;
  --toolbar-bg: #f2f2f7;
  --toolbar-border: #c6c6c8;
  --btn-bg: transparent;
  --btn-active: #007aff;
  --btn-active-bg: rgba(0,122,255,0.12);
  --editor-bg: #ffffff;
  --border: #e5e5ea;
  --placeholder: #8e8e93;
  --popup-bg: #ffffff;
  --popup-shadow: rgba(0,0,0,0.15);
  --table-border: #d1d1d6;
  --icon-filter: brightness(0);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1c1c1e;
    --fg: #aaaaaa;
    --toolbar-bg: #2c2c2e;
    --toolbar-border: #38383a;
    --btn-active-bg: rgba(10,132,255,0.2);
    --btn-active: #0a84ff;
    --editor-bg: #1c1c1e;
    --border: #38383a;
    --placeholder: #636366;
    --popup-bg: #2c2c2e;
    --popup-shadow: rgba(0,0,0,0.4);
    --table-border: #48484a;
    --icon-filter: brightness(0) invert(0.67);
  }
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { color-scheme: light dark; }
html, body {
  height: 100%;
  min-height: 100%;
  min-height: -webkit-fill-available;
  overflow: hidden;
  background: var(--bg);
  color: var(--fg);
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
}
body { display: flex; flex-direction: column; }

/* Toolbar — bottom of flex column, just above the keyboard */
.toolbar-wrap {
  flex-shrink: 0; border-top: 1px solid var(--toolbar-border); background: var(--editor-bg);
  overflow-x: hidden; overflow-y: visible;
  padding-top: 2px;
}
.toolbar {
  display: flex; flex-wrap: nowrap; align-items: center; gap: 1px;
  padding: 2px 6px;
  min-height: 34px;
  overflow-x: auto; overflow-y: visible;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior-y: none;
  touch-action: pan-x;
  -webkit-user-select: none;
  user-select: none;
}
.toolbar::-webkit-scrollbar { display: none; }
.toolbar button {
  flex-shrink: 0; border: none; background: var(--btn-bg);
  color: var(--fg); font-size: 15px; font-weight: 600;
  width: 34px; min-height: 30px; border-radius: 5px;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; -webkit-tap-highlight-color: transparent;
}
.toolbar button:active { opacity: 0.6; }
.toolbar button.active { color: var(--btn-active); background: var(--btn-active-bg); }
.toolbar button svg { width: 21px; height: 21px; fill: currentColor; }
/* Small dropdown hint next to icon (lists, colors, callout) */
.toolbar button svg.toolbar-btn-chevron {
  width: 11px;
  height: 11px;
  flex-shrink: 0;
  fill: currentColor;
}
.toolbar button.toolbar-btn-with-chevron {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 2px;
  width: auto;
  min-width: 40px;
  padding: 0 5px;
}
.toolbar button.toolbar-btn-with-chevron img.icon {
  flex-shrink: 0;
  width: 21px;
  height: 21px;
}
/* Callout toolbar: larger info glyph */
.toolbar button.toolbar-callout-btn svg:first-of-type {
  width: 25px;
  height: 25px;
}
.toolbar button.toolbar-font-size-btn svg.toolbar-font-size-icon {
  width: 21px;
  height: 21px;
  flex-shrink: 0;
}
.toolbar button img.icon { width: 21px; height: 21px; object-fit: contain; filter: var(--icon-filter); }
.toolbar button .toolbar-code-glyph {
  font-size: 14px;
  font-weight: 700;
  font-family: ui-monospace, "SF Mono", Menlo, monospace;
  letter-spacing: -0.12em;
  line-height: 1;
  user-select: none;
}
.toolbar .sep { width: 1px; height: 22px; background: var(--toolbar-border); margin: 0 3px; flex-shrink: 0; }
/* Heading popup (same positioning model as callout/font-size popups) */
.heading-popup {
  display: none; position: fixed; left: 0; top: 0; z-index: 10000;
  background: var(--popup-bg); border: 1px solid var(--border); border-radius: 12px;
  padding: 8px; box-shadow: 0 4px 20px var(--popup-shadow);
  min-width: 180px; max-width: min(92vw, 260px);
}
.heading-popup.visible { display: block; }
.heading-popup-row {
  display: flex; align-items: center; padding: 8px 12px; margin: 2px 0; border-radius: 8px;
  cursor: pointer; -webkit-tap-highlight-color: transparent; touch-action: manipulation;
  font-weight: 600; color: var(--fg);
}
.heading-popup-row:active { opacity: 0.7; }
.heading-popup-row.active { color: var(--btn-active); background: var(--btn-active-bg); }

/* Color popup — fixed to viewport (appended to body) so toolbar overflow never clips or scrolls it */
.color-popup {
  display: none; position: fixed; left: 0; top: 0; z-index: 10000;
  background: var(--popup-bg); border: 1px solid var(--border); border-radius: 10px;
  padding: 8px; box-shadow: 0 4px 20px var(--popup-shadow);
  /* 7×30px swatches + gaps; avoids 0×0 first-paint layout on WKWebView */
  min-width: 248px;
  max-height: min(70vh, 420px); overflow-y: auto; -webkit-overflow-scrolling: touch;
}
.color-popup.visible { display: block; }
/* Callout / admonition picker (same positioning model as .color-popup) */
.callout-popup {
  display: none; position: fixed; left: 0; top: 0; z-index: 10000;
  background: var(--popup-bg); border: 1px solid var(--border); border-radius: 12px;
  padding: 8px; box-shadow: 0 4px 20px var(--popup-shadow);
  min-width: 220px; max-width: min(92vw, 320px);
}
.callout-popup.visible { display: block; }
/* Link editor popup (anchored like color / callout) */
.link-popup {
  display: none; position: fixed; left: 0; top: 0; z-index: 10000;
  background: var(--popup-bg); border: 1px solid var(--border); border-radius: 12px;
  padding: 12px; box-shadow: 0 4px 20px var(--popup-shadow);
  min-width: min(92vw, 300px); max-width: min(92vw, 360px);
}
.link-popup.visible { display: block; }
/* Font size picker (same positioning / dismiss model as .callout-popup) */
.font-size-popup {
  display: none; position: fixed; left: 0; top: 0; z-index: 10000;
  background: var(--popup-bg); border: 1px solid var(--border); border-radius: 12px;
  padding: 8px; box-shadow: 0 4px 20px var(--popup-shadow);
  min-width: 200px; max-width: min(92vw, 300px);
}
.font-size-popup.visible { display: block; }
.font-size-popup .text-tiny { font-size: 0.7em; }
.font-size-popup .text-small { font-size: 0.85em; }
.font-size-popup .text-big { font-size: 1.4em; }
.font-size-popup .text-huge { font-size: 1.8em; }
/* Bullet / numbered list style picker */
.list-style-popup {
  display: none; position: fixed; left: 0; top: 0; z-index: 10000;
  background: var(--popup-bg); border: 1px solid var(--border); border-radius: 12px;
  padding: 8px; box-shadow: 0 4px 20px var(--popup-shadow);
  min-width: min(92vw, 280px); max-width: min(92vw, 340px);
}
.list-style-popup.visible { display: block; }
.list-style-row-label { font-size: 14px; font-weight: 600; line-height: 1.25; }
.list-style-row-hint { font-size: 12px; font-weight: 500; opacity: 0.65; margin-top: 2px; }
.link-popup label.link-popup-label {
  display: block; font-size: 12px; font-weight: 600; margin-bottom: 6px; opacity: 0.75; color: var(--fg);
}
.link-popup input.link-popup-input {
  width: 100%; box-sizing: border-box; padding: 10px 12px; font-size: 16px; line-height: 1.3;
  border-radius: 8px; border: 1px solid var(--border); background: var(--bg); color: var(--fg);
  -webkit-appearance: none; appearance: none;
}
.link-popup .link-popup-actions {
  display: flex; gap: 8px; margin-top: 12px;
}
.link-popup .link-popup-actions button {
  flex: 1; border: none; border-radius: 8px; padding: 10px 12px; font-size: 15px; font-weight: 600;
  cursor: pointer; -webkit-tap-highlight-color: transparent; touch-action: manipulation;
}
.link-popup .link-popup-apply {
  background: var(--btn-active); color: #fff;
}
.link-popup .link-popup-remove {
  background: var(--border); color: var(--fg);
}
.callout-row {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 12px; margin: 3px 0; border-radius: 10px;
  border: 1px solid var(--border); cursor: pointer;
  font-size: 15px; font-weight: 600; color: var(--fg);
  -webkit-tap-highlight-color: transparent; touch-action: manipulation;
}
.callout-row:active { opacity: 0.75; }
.callout-row .callout-row-icon { flex-shrink: 0; width: 22px; height: 22px; display: flex; align-items: center; justify-content: center; }
.callout-row .callout-row-icon svg { width: 20px; height: 20px; }
.color-grid { display: grid; grid-template-columns: repeat(7, 30px); gap: 4px; }
.color-swatch {
  width: 30px; height: 30px; border-radius: 6px; border: 2px solid transparent;
  cursor: pointer; -webkit-tap-highlight-color: transparent;
}
.color-swatch:active { opacity: 0.7; }
.color-swatch.clear-color { border: 2px solid var(--border); position: relative; }
.color-swatch.clear-color::after {
  content: ''; position: absolute; top: 50%; left: 0; width: 100%; height: 2px;
  background: red; transform: rotate(-45deg);
}

/* Editor area — extra bottom padding so the last lines aren’t tight against the keyboard */
#editor-container {
  flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; cursor: text;
  background: var(--editor-bg);
}
.tiptap {
  padding: 16px 16px 20px; outline: none; min-height: 100%; font-size: 18px; line-height: 1.6; color: var(--fg);
  background: var(--editor-bg);
}
.tiptap p { margin: 0.4em 0; }
.tiptap h1 { font-size: 1.8em; margin: 0.6em 0 0.3em; }
.tiptap h2 { font-size: 1.5em; margin: 0.5em 0 0.3em; }
.tiptap h3 { font-size: 1.3em; margin: 0.5em 0 0.3em; }
.tiptap h4 { font-size: 1.15em; margin: 0.4em 0 0.2em; }
.tiptap h5 { font-size: 1.05em; margin: 0.4em 0 0.2em; }
.tiptap h6 { font-size: 1em; margin: 0.4em 0 0.2em; }
.tiptap ul, .tiptap ol { padding-left: 24px; }
.tiptap ul[data-type="taskList"] { list-style: none; padding-left: 4px; }
/* Use > li (not [data-type=taskItem]) so every task row keeps checkbox + text on one line */
.tiptap ul[data-type="taskList"] > li {
  display: flex;
  align-items: flex-start;
  gap: 8px;
}
.tiptap ul[data-type="taskList"] > li > label {
  flex-shrink: 0;
  /* Slightly lower than before (was 3px) so checkbox lines up with first line of text */
  margin-top: 5px;
}
.tiptap ul[data-type="taskList"] > li > label input[type="checkbox"] {
  margin: 0;
  vertical-align: top;
  accent-color: var(--btn-active);
  cursor: pointer;
}
/* TipTap puts copy in div > p; dropping first-p top margin avoids text sitting low vs checkbox */
.tiptap ul[data-type="taskList"] > li > div > p:first-child { margin-top: 0; }
.tiptap ul[data-type="taskList"] > li > p:first-child { margin-top: 0; }
.tiptap blockquote { border-left: 4px solid var(--border); margin: 0.5em 0; padding: 4px 16px; opacity: 0.85; }
/* TriliumNext CKEditor admonitions: <aside class="admonition note">… — plus legacy div[data-callout-type] */
.tiptap aside.admonition { margin: 0.65em 0; border-radius: 10px; padding: 10px 12px 10px 14px; border: 1px solid; background: rgba(128,128,128,0.06); display: block; }
.tiptap aside.admonition > *:first-child { margin-top: 0; }
.tiptap aside.admonition > *:last-child { margin-bottom: 0; }
.tiptap aside.admonition.note, .tiptap div[data-callout-type="note"] { border-color: #4a9eff; }
.tiptap aside.admonition.note::before, .tiptap div[data-callout-type="note"]::before {
  content: "Note"; display: block; font-weight: 700; font-size: 0.82em; letter-spacing: 0.02em;
  margin-bottom: 6px; color: #4a9eff;
}
.tiptap aside.admonition.tip, .tiptap div[data-callout-type="tip"] { border-color: #3fb950; }
.tiptap aside.admonition.tip::before, .tiptap div[data-callout-type="tip"]::before {
  content: "Tip"; display: block; font-weight: 700; font-size: 0.82em; margin-bottom: 6px; color: #3fb950;
}
.tiptap aside.admonition.important, .tiptap div[data-callout-type="important"] { border-color: #a371f7; }
.tiptap aside.admonition.important::before, .tiptap div[data-callout-type="important"]::before {
  content: "Important"; display: block; font-weight: 700; font-size: 0.82em; margin-bottom: 6px; color: #a371f7;
}
.tiptap aside.admonition.caution, .tiptap div[data-callout-type="caution"] { border-color: #f85149; }
.tiptap aside.admonition.caution::before, .tiptap div[data-callout-type="caution"]::before {
  content: "Caution"; display: block; font-weight: 700; font-size: 0.82em; margin-bottom: 6px; color: #f85149;
}
.tiptap aside.admonition.warning, .tiptap div[data-callout-type="warning"] { border-color: #d29922; }
.tiptap aside.admonition.warning::before, .tiptap div[data-callout-type="warning"]::before {
  content: "Warning"; display: block; font-weight: 700; font-size: 0.82em; margin-bottom: 6px; color: #d29922;
}
@media (prefers-color-scheme: dark) {
  .tiptap aside.admonition, .tiptap div[data-callout-type] { background: rgba(255,255,255,0.05); }
}
.tiptap pre { background: rgba(128,128,128,0.1); padding: 12px; border-radius: 8px; overflow-x: auto; font-size: 14px; font-family: "SF Mono", Menlo, monospace; }
.tiptap code { background: rgba(128,128,128,0.1); padding: 2px 6px; border-radius: 4px; font-size: 14px; font-family: "SF Mono", Menlo, monospace; }
.tiptap pre code { background: none; padding: 0; }
.tiptap img { max-width: 100%; height: auto; border-radius: 6px; cursor: pointer; }
.tiptap img.ProseMirror-selectednode { outline: 2px solid var(--btn-active); outline-offset: 2px; border-radius: 6px; }

/* CKEditor-compatible figure/image styles */
.tiptap figure.image { display: block; clear: both; text-align: center; margin: 0.9em auto; max-width: 100%; overflow: hidden; }
.tiptap figure.image img { display: block; margin: 0 auto; max-width: 100%; height: auto; border-radius: 6px; cursor: pointer; }
.tiptap figure.image figcaption {
  word-break: break-word;
  color: var(--placeholder); background: rgba(128,128,128,0.06);
  font-size: 0.75em; line-height: 1.4; padding: 6px 10px; outline: none;
}
.tiptap figure.image.image_resized { max-width: 100%; }
.tiptap figure.image.image_resized img { width: 100%; }

/* Alignment: inline (default) — flows with text */
.tiptap figure.image-style-inline { display: inline-block; margin: 0.3em 0.5em; vertical-align: bottom; }

/* Wrap text: float left/right — cap width so text always has room to wrap beside the image */
.tiptap figure.image-style-align-left { float: left; margin: 0.5em 1.2em 0.5em 0; max-width: 50%; }
.tiptap figure.image-style-align-right { float: right; margin: 0.5em 0 0.5em 1.2em; max-width: 50%; }
/* Block centered (default block style) */
.tiptap figure.image-style-block-align-center,
.tiptap figure.image:not([class*="image-style-"]) { display: table; margin-left: auto; margin-right: auto; clear: both; }
/* Block left */
.tiptap figure.image-style-block-align-left { display: table; margin-left: 0; margin-right: auto; clear: both; }
/* Block right */
.tiptap figure.image-style-block-align-right { display: table; margin-left: auto; margin-right: 0; clear: both; }
/* Side image (CKEditor "side" semantic style — float right, capped width) */
.tiptap figure.image-style-side { float: right; margin: 0.5em 0 0.5em 1.2em; max-width: 50%; }

/* Image popup (anchored to image, not toolbar) */
.image-popup {
  display: none; position: fixed; z-index: 10000;
  background: var(--popup-bg); border: 1px solid var(--border); border-radius: 12px;
  padding: 8px 10px; box-shadow: 0 4px 20px var(--popup-shadow);
  min-width: min(88vw, 280px); max-width: min(92vw, 340px);
}
.image-popup.visible { display: flex; flex-direction: column; gap: 6px; }
.image-popup-section-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; color: var(--placeholder); padding: 2px 4px 0; }
.image-popup-row {
  display: flex; align-items: center; gap: 8px; padding: 7px 8px; border-radius: 8px;
  cursor: pointer; font-size: 14px; font-weight: 500; color: var(--fg);
  -webkit-tap-highlight-color: transparent; touch-action: manipulation;
}
.image-popup-row:active { opacity: 0.7; }
.image-popup-row.active { background: var(--btn-active-bg); color: var(--btn-active); }
.image-popup-row svg { width: 18px; height: 18px; flex-shrink: 0; }
.image-popup-size-grid { display: flex; flex-wrap: wrap; gap: 6px; padding: 2px 4px; }
.image-popup-size-btn {
  flex: 1; min-width: 50px; text-align: center; padding: 6px 4px; border-radius: 8px;
  border: 1px solid var(--border); font-size: 13px; font-weight: 600; color: var(--fg);
  cursor: pointer; -webkit-tap-highlight-color: transparent; touch-action: manipulation;
  background: transparent;
}
.image-popup-size-btn:active { opacity: 0.7; }
.image-popup-size-btn.active { background: var(--btn-active-bg); color: var(--btn-active); border-color: var(--btn-active); }

.tiptap hr { border: none; border-top: 2px solid var(--border); margin: 1em 0; clear: both; }
.tiptap a { color: var(--btn-active); text-decoration: underline; }
/* TipTap Highlight → <mark>; ensure multicolor backgrounds paint (esp. WebKit / line wraps) */
.tiptap mark {
  -webkit-box-decoration-break: clone;
  box-decoration-break: clone;
  border-radius: 2px;
  padding: 0.05em 0;
}
.tiptap .tableWrapper { overflow-x: auto; -webkit-overflow-scrolling: touch; margin: 0.5em 0; position: relative; }
.tiptap table { border-collapse: separate; border-spacing: 0; width: 100%; }
.tiptap th, .tiptap td { border-right: 1px solid var(--table-border); border-bottom: 1px solid var(--table-border); padding: 6px 10px; min-width: 30px; vertical-align: top; word-wrap: break-word; overflow-wrap: break-word; }
.tiptap tr:first-child > th, .tiptap tr:first-child > td { border-top: 1px solid var(--table-border); }
.tiptap th:first-child, .tiptap td:first-child { border-left: 1px solid var(--table-border); }
.tiptap th { background: rgba(128,128,128,0.08); font-weight: 600; }
.tiptap td.selectedCell, .tiptap th.selectedCell,
.tiptap td[data-user-selected-cell], .tiptap th[data-user-selected-cell] {
  background-color: rgba(0,122,255,0.3) !important;
  box-shadow: inset 0 0 0 2px rgba(0,122,255,0.5) !important;
}
@media (prefers-color-scheme: dark) {
  .tiptap td.selectedCell, .tiptap th.selectedCell,
  .tiptap td[data-user-selected-cell], .tiptap th[data-user-selected-cell] {
    background-color: rgba(10,132,255,0.35) !important;
    box-shadow: inset 0 0 0 2px rgba(10,132,255,0.6) !important;
  }
}
.tiptap table.cell-select-active { outline: 2px dashed var(--btn-active); outline-offset: 2px; }
.tiptap table.cell-select-active td, .tiptap table.cell-select-active th { cursor: pointer; }
/* Table caption: a styled div inside .tableWrapper, above the <table> */
.tiptap .tableWrapper .table-caption-box {
  text-align: center; font-size: 0.85em; line-height: 1.4; color: var(--placeholder);
  background: rgba(128,128,128,0.06); padding: 6px 10px; border-radius: 6px 6px 0 0;
  border: 1px solid var(--border); border-bottom: none; margin: 0; outline: none;
  min-height: 1.4em; word-break: break-word;
}
.tiptap .tableWrapper .table-caption-box:empty::before {
  content: 'Caption'; opacity: 0.5; pointer-events: none;
}
.tiptap .tableWrapper .table-caption-box + table { border-top-left-radius: 0; border-top-right-radius: 0; }
.table-grid-popup {
  display: none; position: fixed; left: 0; top: 0; z-index: 10000;
  background: var(--popup-bg); border: 1px solid var(--border); border-radius: 10px;
  padding: 10px; box-shadow: 0 4px 20px var(--popup-shadow);
}
.table-grid-popup.visible { display: block; }
.table-grid-container { display: grid; grid-template-columns: repeat(10, 24px); gap: 3px; touch-action: none; }
.table-grid-cell {
  width: 24px; height: 24px; border-radius: 3px;
  border: 1px solid var(--border); background: transparent; transition: background 0.06s;
}
.table-grid-cell.highlighted { background: var(--btn-active-bg); border-color: var(--btn-active); }
.table-grid-label { font-size: 13px; font-weight: 600; color: var(--placeholder); min-height: 18px; flex: 1; }
.table-grid-footer { display: flex; align-items: center; justify-content: space-between; margin-top: 8px; gap: 8px; }
.table-grid-ok {
  display: none; padding: 6px 18px; border-radius: 8px; border: none;
  background: var(--btn-active); color: #fff; font-size: 14px; font-weight: 600;
  cursor: pointer; -webkit-tap-highlight-color: transparent; touch-action: manipulation;
}
.table-grid-ok.visible { display: block; }
.table-grid-ok:active { opacity: 0.7; }
.table-context-bar {
  display: none; flex-wrap: nowrap; align-items: center; gap: 2px;
  padding: 3px 6px; min-height: 34px;
  border-bottom: 1px solid var(--toolbar-border); background: var(--editor-bg);
  overflow-x: auto; -webkit-overflow-scrolling: touch;
  -webkit-user-select: none; user-select: none;
}
.table-context-bar::-webkit-scrollbar { display: none; }
.table-context-bar.visible { display: flex; }
.table-ctx-btn {
  flex-shrink: 0; border: none; background: transparent;
  color: var(--fg); width: 30px; height: 28px; border-radius: 6px;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; -webkit-tap-highlight-color: transparent; touch-action: manipulation;
  font-size: 13px; font-weight: 600;
}
.table-ctx-btn:active { opacity: 0.6; }
.table-ctx-btn.active { color: var(--btn-active); background: var(--btn-active-bg); }

// Color pickers — restore range before applying marks (see editorSavedRange above).
// After applying a mark, scroll the selection into the area visible above the keyboard (visualViewport).
function scrollEditorRangeIntoView() {
  const ec = document.getElementById('editor-container');
  const view = editor.view;
  if (!ec || !view) return;
  const { from, to } = editor.state.selection;
  let topDoc, bottomDoc;
  try {
    const c1 = view.coordsAtPos(from);
    const c2 = view.coordsAtPos(to);
    topDoc = Math.min(c1.top, c2.top, c1.bottom, c2.bottom);
    bottomDoc = Math.max(c1.top, c2.top, c1.bottom, c2.bottom);
  } catch (e) {
    return;
  }
  const pad = 12;
  const ecRect = ec.getBoundingClientRect();
  let visibleTop = ecRect.top + pad;
  let visibleBottom = ecRect.bottom - pad;
  const vv = window.visualViewport;
  if (vv) {
    const vTop = vv.offsetTop + pad;
    const vBottom = vv.offsetTop + vv.height - pad;
    visibleTop = Math.max(visibleTop, vTop);
    visibleBottom = Math.min(visibleBottom, vBottom);
  }
  if (visibleBottom <= visibleTop) return;

  if (topDoc < visibleTop) {
    ec.scrollTop += topDoc - visibleTop;
  } else if (bottomDoc > visibleBottom) {
    ec.scrollTop += bottomDoc - visibleBottom;
  }
}

// iOS: keyboard / visualViewport settle after focus — scroll so the caret stays above the keys.
function scheduleScrollCaretIntoViewAfterKeyboard() {
  const bump = function () { scrollEditorRangeIntoView(); };
  bump();
  requestAnimationFrame(function () {
    bump();
    requestAnimationFrame(bump);
  });
  setTimeout(bump, 80);
  setTimeout(bump, 200);
  setTimeout(bump, 400);
  setTimeout(bump, 600);
  setTimeout(bump, 850);
  setTimeout(bump, 1100);
}

(function attachCaretScrollOnVisualViewport() {
  const vv = window.visualViewport;
  if (!vv) return;
  let debounceTimer = null;
  function onViewportChange() {
    try {
      if (!editor.view || !editor.view.hasFocus()) return;
    } catch (e) {
      return;
    }
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(function () {
      scrollEditorRangeIntoView();
    }, 50);
  }
  vv.addEventListener('resize', onViewportChange, { passive: true });
  vv.addEventListener('scroll', onViewportChange, { passive: true });
})();

editor.on('focus', function () {
  scheduleScrollCaretIntoViewAfterKeyboard();
});

(function trackKeyboardAndBodyHeight() {
  const vv = window.visualViewport;
  if (!vv) return;
  const GAP = 10;
  var baseline = Math.max(vv.height, window.innerHeight, screen.height * 0.6);
  let scheduled = false;
  const tw = document.getElementById('toolbar-wrap');
  function update() {
    scheduled = false;
    const h = vv.height;
    if (h > baseline) baseline = h;
    const kbOpen = h < baseline - 90;
    const bodyH = kbOpen ? h - GAP : h;
    document.body.style.height = bodyH + 'px';
    document.body.style.minHeight = bodyH + 'px';
    if (tw) tw.style.paddingBottom = kbOpen ? '0px' : 'env(safe-area-inset-bottom, 0px)';
  }
  function schedule() {
    if (scheduled) return;
    scheduled = true;
    requestAnimationFrame(update);
  }
  vv.addEventListener('resize', schedule);
  window.addEventListener('resize', schedule);
  editor.on('focus', function () { setTimeout(schedule, 120); setTimeout(schedule, 350); setTimeout(schedule, 700); });
  editor.on('blur', function () { setTimeout(schedule, 120); setTimeout(schedule, 350); });
  update();
})();

function restoreSelectionAfterPopup(from, to) {
  function restore() {
    try { editor.commands.setTextSelection(from === to ? from : { from, to }); } catch (_) {}
  }
  restore();
  setTimeout(restore, 10);
  setTimeout(restore, 50);
  setTimeout(restore, 120);
  setTimeout(restore, 250);
}

function relayoutImagePopup() {
  const pos = imagePopup._targetPos;

    const domAtPos = editor.view.nodeDOM(pos);
    const img = domAtPos && domAtPos.querySelector ? domAtPos.querySelector('img') : null;

function layoutImagePopup(imgEl) {
  if (!imagePopup.classList.contains('visible')) return;
  imagePopup.style.visibility = 'hidden';
  imagePopup.style.left = '0px';
  imagePopup.style.top = '0px';
  const pr = imagePopup.getBoundingClientRect();
  const ir = imgEl.getBoundingClientRect();
  const margin = 8;
  const vv = window.visualViewport;
  const viewTop = vv ? vv.offsetTop : 0;
  const viewBottom = vv ? (vv.offsetTop + vv.height) : window.innerHeight;
  const pw = Math.max(pr.width, 1);
  const ph = Math.max(pr.height, 1);
  let left = ir.left + (ir.width - pw) / 2;
  left = Math.max(margin, Math.min(left, window.innerWidth - pw - margin));
  let top = ir.top - ph - 8;
  if (top < viewTop + margin) {
    top = ir.bottom + 8;
    if (top + ph > viewBottom - margin) {
      top = Math.max(viewTop + margin, viewBottom - ph - margin);
    }
  }
  imagePopup.style.left = Math.round(left) + 'px';
  imagePopup.style.top = Math.round(top) + 'px';
  imagePopup.style.visibility = '';
}

// Click handler on editor images — also handles re-click to toggle
function findImageNodePos(img) {
  const view = editor.view;
  const domPos = view.posAtDOM(img, 0);
  const resolved = editor.state.doc.resolve(domPos);
  let pos = domPos;
  for (let d = resolved.depth; d >= 0; d--) {
    if (resolved.node(d).type.name === 'image') {
      pos = resolved.before(d);
      break;
    }
  }
  return pos;
}

function normalizeLinkUrl(raw) {
  const t = (raw || '').trim();
  if (!t) return '';
  if (/^mailto:/i.test(t) || /^tel:/i.test(t)) return t;
  if (/^\/[\s\S]*/.test(t)) return t;
  if (/^[\w.-]+\.[a-z]{2,}([\/?#][^\s]*)?$/i.test(t) && !/^https?:\/\//i.test(t)) return 'https://' + t;
  return t;
}

// --- CKEditor ↔ TipTap HTML conversion ---
//
// CKEditor:  <ul class="todo-list"><li>
//              <label class="todo-list__label">
//                <input type="checkbox" disabled [checked]>
//                <span class="todo-list__label__description">text</span>
//              </label></li></ul>
//
// TipTap getHTML():  <ul data-type="taskList"><li data-type="taskItem" data-checked="false">
//                      <label><input type="checkbox"><span></span></label>
//                      <div><p>text</p></div></li></ul>
//
// TipTap setContent() expects:  <ul data-type="taskList">
//                                 <li data-type="taskItem" data-checked="false">text</li></ul>

// TriliumNext saves <aside class="admonition note"> (ckeditor5-admonition). TipTap callout parses that natively.
// Also: legacy div[data-callout-type], blockquote, GitHub markdown-alert → same <aside> shape for the editor.
function migrateTriliumAdmonitionsForTiptap(doc) {
  const types = ['note', 'tip', 'important', 'caution', 'warning'];
  function detectType(className) {
    if (!className) return null;
    const c = className.toLowerCase();
    for (const t of types) {
      if (c.includes('admonition-' + t) || c.includes('admonition_' + t)) return t;
      if (c.includes('callout-' + t) || c.includes('callout_' + t)) return t;
      if (c.includes('markdown-alert-' + t)) return t;
    }
    return null;
  }
  function makeAside(t) {
    const aside = doc.createElement('aside');
    aside.className = 'admonition ' + t;
    return aside;
  }
  doc.querySelectorAll('div[data-callout-type]').forEach(div => {
    const raw = (div.getAttribute('data-callout-type') || 'note').trim();
    const t = types.includes(raw) ? raw : 'note';
    const aside = makeAside(t);
    while (div.firstChild) aside.appendChild(div.firstChild);
    div.parentNode.replaceChild(aside, div);
  });
  doc.querySelectorAll('blockquote[class]').forEach(bq => {
    const t = detectType(bq.getAttribute('class'));
    if (!t) return;
    const aside = makeAside(t);
    while (bq.firstChild) aside.appendChild(bq.firstChild);
    bq.parentNode.replaceChild(aside, bq);
  });
  doc.querySelectorAll('div[class*="markdown-alert"]').forEach(div => {
    const t = detectType(div.getAttribute('class') || '') || 'note';
    const aside = makeAside(t);
    while (div.firstChild) aside.appendChild(div.firstChild);
    div.parentNode.replaceChild(aside, div);
  });
}

// Saved HTML must match Trilium desktop: <aside class="admonition TYPE"> (not div[data-callout-type]).
function normalizeCalloutsForTrilium(doc) {
  const types = ['note', 'tip', 'important', 'caution', 'warning'];
  doc.querySelectorAll('div[data-callout-type]').forEach(div => {
    const raw = (div.getAttribute('data-callout-type') || 'note').trim();
    const t = types.includes(raw) ? raw : 'note';
    const aside = doc.createElement('aside');
    aside.className = 'admonition ' + t;
    while (div.firstChild) aside.appendChild(div.firstChild);
    div.parentNode.replaceChild(aside, div);
  });
  doc.querySelectorAll('aside.admonition').forEach(aside => {
    const typeClass = types.find(tt => aside.classList.contains(tt));
    const t = typeClass || 'note';
    aside.className = 'admonition ' + t;
  });
}

// CKEditor / Trilium often use <span style="background-color:…">; TipTap Highlight expects <mark data-color>.
function migrateCkColorMarkupForTiptap(doc) {
  const body = doc.body;
  const spans = Array.from(body.querySelectorAll('span[style]')).reverse();
  spans.forEach(span => {
    if (!span.parentNode) return;
    const style = span.getAttribute('style') || '';
    const bgMatch = style.match(/background-color\s*:\s*([^;]+)/i);
    if (!bgMatch) return;
    const d = span.ownerDocument;
    const mark = d.createElement('mark');
    const bgVal = bgMatch[1].trim();
    mark.style.backgroundColor = bgVal;
    mark.setAttribute('data-color', bgVal);
    const colorMatch = style.match(/(?:^|;)\s*color\s*:\s*([^;]+)/i);
    if (colorMatch) {
      const inner = d.createElement('span');
      inner.setAttribute('style', 'color: ' + colorMatch[1].trim());
      while (span.firstChild) inner.appendChild(span.firstChild);
      mark.appendChild(inner);
    } else {
      while (span.firstChild) mark.appendChild(span.firstChild);
    }
    span.parentNode.replaceChild(mark, span);
  });
}

// TipTap saves <mark>; convert back to spans for CKEditor-compatible HTML / Trilium desktop.
function tiptapMarkToCkSpans(doc) {
  doc.querySelectorAll('mark').forEach(mark => {
    if (!mark.parentNode) return;
    const span = doc.createElement('span');
    const dc = mark.getAttribute('data-color');
    const st = mark.getAttribute('style') || '';
    const bgMatch = st.match(/background-color\s*:\s*([^;]+)/i);
    const bg = (dc || (bgMatch ? bgMatch[1].trim() : '')).trim();
    if (bg) span.style.backgroundColor = bg;
    while (mark.firstChild) span.appendChild(mark.firstChild);
    mark.parentNode.replaceChild(span, mark);
  });
}

function ckToTiptap(html) {
  if (!html) return html;
  const doc = new DOMParser().parseFromString(html, 'text/html');

  // Clean up any stale float-clear markers from earlier versions
  doc.querySelectorAll('[data-trinote-clear-after-float]').forEach(el => {
    el.removeAttribute('data-trinote-clear-after-float');
    const s = (el.getAttribute('style') || '').replace(/(^|;)\s*clear\s*:\s*both\s*;?/gi, '$1').replace(/^;|;;+/g, ';').trim();
    if (s) el.setAttribute('style', s.replace(/^;\s*/, ''));
    else el.removeAttribute('style');
  });

  doc.querySelectorAll('ul.todo-list').forEach(ul => {
    ul.removeAttribute('class');
    ul.setAttribute('data-type', 'taskList');

    ul.querySelectorAll(':scope > li').forEach(li => {
      const cb = li.querySelector('input[type="checkbox"]');
      const checked = cb && cb.hasAttribute('checked') ? 'true' : 'false';
      li.setAttribute('data-type', 'taskItem');
      li.setAttribute('data-checked', checked);

      const desc = li.querySelector('.todo-list__label__description');
      const textHTML = desc ? desc.innerHTML : '';

      // Strip the entire CKEditor label; leave only plain inline text for TipTap to parse
      const label = li.querySelector('label.todo-list__label');
      if (label) label.remove();
      li.innerHTML = textHTML;
    });
  });

  // Unwrap <figure class="table"> wrappers (CKEditor 5 format) so TipTap sees bare <table>
  doc.querySelectorAll('figure.table').forEach(fig => {
    const tbl = fig.querySelector('table');
    if (tbl) fig.parentNode.insertBefore(tbl, fig);
    fig.remove();
  });

  migrateTriliumAdmonitionsForTiptap(doc);
  migrateCkColorMarkupForTiptap(doc);
  return doc.body.innerHTML;
}

function tiptapToCk(html) {
  if (!html) return html;
  const doc = new DOMParser().parseFromString(html, 'text/html');

  normalizeCalloutsForTrilium(doc);
  tiptapMarkToCkSpans(doc);

  doc.querySelectorAll('ul[data-type="taskList"]').forEach(ul => {
    ul.removeAttribute('data-type');
    ul.classList.add('todo-list');

    ul.querySelectorAll(':scope > li[data-type="taskItem"]').forEach(li => {
      const checked = li.getAttribute('data-checked') === 'true';
      li.removeAttribute('data-type');
      li.removeAttribute('data-checked');

      const tiptapLabel = li.querySelector(':scope > label');
      if (tiptapLabel) tiptapLabel.remove();

      let textHTML = '';
      const contentDiv = li.querySelector(':scope > div');
      if (contentDiv) {
        const p = contentDiv.querySelector('p');
        textHTML = p ? p.innerHTML : contentDiv.innerHTML;
      } else {
        const p = li.querySelector(':scope > p');
        textHTML = p ? p.innerHTML : li.innerHTML;
      }

      const label = doc.createElement('label');
      label.className = 'todo-list__label';

      const cb = doc.createElement('input');
      cb.type = 'checkbox';
      cb.disabled = true;
      if (checked) cb.setAttribute('checked', 'checked');

      const span = doc.createElement('span');
      span.className = 'todo-list__label__description';
      span.innerHTML = textHTML;

      label.appendChild(cb);
      label.appendChild(span);
      li.innerHTML = '';
      li.appendChild(label);
    });
  });

  // CKEditor 5 / Trilium wraps ALL tables in <figure class="table">
  doc.querySelectorAll('table').forEach(tbl => {
    if (tbl.parentElement && tbl.parentElement.tagName === 'FIGURE' && tbl.parentElement.classList.contains('table')) return;
    const figure = doc.createElement('figure');
    figure.className = 'table';
    tbl.parentNode.insertBefore(figure, tbl);
    figure.appendChild(tbl);
  });

  return doc.body.innerHTML;
}

// --- Bridge ---
window.editorBridge = {
  setKeyboardToolbarGap(px) {},
  setContent(html) {
    // Extract captions before ProseMirror parsing (PM would discard them).
    // Supports CKEditor 5 format (<figure class="table">...<figcaption>) and standard <caption>.
    const captionTexts = [];
    if (html) {
      const tempDoc = new DOMParser().parseFromString(html, 'text/html');

      // CKEditor 5 format: mark tables that have figcaptions, then unwrap figures
      tempDoc.querySelectorAll('figure.table').forEach(fig => {
        const figcap = fig.querySelector('figcaption');
        const tbl = fig.querySelector('table');
        if (figcap && tbl) {
          tbl.setAttribute('data-trinote-caption', figcap.textContent || '');
          figcap.remove();
        }
        if (tbl) fig.parentNode.insertBefore(tbl, fig);
        fig.remove();
      });

      // Standard HTML <caption> fallback
      tempDoc.querySelectorAll('table > caption').forEach(cap => {
        const tbl = cap.parentElement;
        if (tbl && !tbl.hasAttribute('data-trinote-caption')) {
          tbl.setAttribute('data-trinote-caption', cap.textContent || '');
        }
        cap.remove();
      });

      // Collect captions using correct global table indices, then clean up the marker
      tempDoc.querySelectorAll('table').forEach((tbl, idx) => {
        if (tbl.hasAttribute('data-trinote-caption')) {
          captionTexts.push({ idx, text: tbl.getAttribute('data-trinote-caption') });
          tbl.removeAttribute('data-trinote-caption');
        }
      });

      html = tempDoc.body.innerHTML;
    }
    tableDbg('bridge.setContent', { captionsFound: captionTexts.length, htmlLen: (html || '').length });
    editor.commands.setContent(ckToTiptap(html) || '', false);
    if (captionTexts.length > 0) {
      requestAnimationFrame(() => {
        const wrappers = document.querySelectorAll('.tiptap .tableWrapper');
        captionTexts.forEach(({ idx, text }) => {
          const wrapper = wrappers[idx];
          if (!wrapper) return;
          const tableEl = wrapper.querySelector('table');
          if (!tableEl) return;
          if (Array.from(wrapper.children).find(ch => ch.classList && ch.classList.contains('table-caption-box'))) return;
          const capDiv = document.createElement('div');
          capDiv.className = 'table-caption-box';

// --- Shared table utilities ---
function findTableAroundPos(pos) {
  try {
    const $pos = editor.state.doc.resolve(pos);
    for (let d = $pos.depth; d > 0; d--) {
      if ($pos.node(d).type.name === 'table') {
        tableDbg('findTableAroundPos.hit', { pos, depth: d, start: $pos.before(d), end: $pos.after(d) });
        return { start: $pos.before(d), end: $pos.after(d), depth: d, node: $pos.node(d) };
      }
    }
  } catch (e) {}
  tableDbg('findTableAroundPos.miss', { pos });
  return null;
}
function findCellAtPos(pos) {
  try {
    const $pos = editor.state.doc.resolve(pos);
    for (let d = $pos.depth; d > 0; d--) {
      const n = $pos.node(d);
      if (n.type.name === 'tableCell' || n.type.name === 'tableHeader') {
        return { pos: $pos.before(d), node: n, depth: d };
      }
    }
  } catch (e) {}
  return null;
}
function getTableDOMWrapper() {
  const table = findTableAroundPos(editor.state.selection.from);
  if (!table) {
    tableDbg('getTableDOMWrapper.noTable', { from: editor.state.selection.from });
    return null;
  }
  try {
    const dom = editor.view.nodeDOM(table.start);
    if (dom) {
      const domTag = dom.tagName || 'text';
      const domClass = dom.className || '';
      const isWrapper = dom.classList && dom.classList.contains('tableWrapper');
      const wrapper = isWrapper ? dom : (dom.closest('.tableWrapper') || dom.parentElement);
      tableDbg('getTableDOMWrapper.hit', {
        from: editor.state.selection.from,
        tableStart: table.start,
        domTag, domClass, isWrapper,
        wrapperTag: wrapper ? wrapper.tagName : null,
        wrapperClass: wrapper && wrapper.className ? wrapper.className : null,
      });
      return wrapper;
    }
  } catch (e) {
    tableDbg('getTableDOMWrapper.error', { msg: e.message });
  }
  tableDbg('getTableDOMWrapper.fail', { from: editor.state.selection.from, tableStart: table.start });
  return null;
}

// Build a visual table map accounting for colspan and rowspan.
// Returns array of { pos, node, row, col, colspan, rowspan } for every cell.
function _buildTableMap(table) {
  const numRows = table.node.childCount;
  const occupied = Array.from({ length: numRows }, () => ({}));
  const cells = [];

  let rowIdx = 0;
  table.node.forEach((rowNode, rowOffset) => {
    const rowStart = table.start + 1 + rowOffset;
    let visualCol = 0;

    rowNode.forEach((cellNode, cellOffset) => {
      while (occupied[rowIdx][visualCol]) visualCol++;

      const absPos = rowStart + 1 + cellOffset;
      const colspan = cellNode.attrs.colspan || 1;
      const rowspan = cellNode.attrs.rowspan || 1;

      cells.push({ pos: absPos, node: cellNode, row: rowIdx, col: visualCol, colspan, rowspan });

      for (let r = 0; r < rowspan; r++) {
        for (let c = 0; c < colspan; c++) {
          if (rowIdx + r < numRows) occupied[rowIdx + r][visualCol + c] = true;
        }
      }
      visualCol += colspan;
    });
    rowIdx++;
  });
  return cells;
}

// CKEditor 5-style split: on a 1×1 cell, inserts a new empty cell beside it
// and increases the colspan/rowspan of every OTHER cell that spans the same
// column/row so the visual grid stays aligned.
function _splitCellVertically() {
  const cell = findCellAtPos(editor.state.selection.from);
  if (!cell) return false;
  const table = findTableAroundPos(editor.state.selection.from);
  if (!table) return false;
  const { colspan } = cell.node.attrs;

  // Merged cell (colspan > 1): reduce colspan by 1, insert new cell to the right
  if (colspan > 1) {
    try {
      const cellType = cell.node.type;
      const defaults = {};
      for (const k of Object.keys(cellType.attrs)) defaults[k] = cellType.attrs[k].default;
      const newCell = cellType.createAndFill({ ...defaults, rowspan: cell.node.attrs.rowspan, colspan: 1 });
      if (!newCell) return false;
      const tr = editor.state.tr;
      tr.insert(cell.pos + cell.node.nodeSize, newCell);
      tr.setNodeMarkup(tr.mapping.map(cell.pos), null, { ...cell.node.attrs, colspan: colspan - 1 });
      editor.view.dispatch(tr);
      return true;
    } catch(e) { return false; }
  }

  // Unmerged cell (colspan = 1): CKEditor 5-style vertical split
  const cellMap = _buildTableMap(table);
  const targetEntry = cellMap.find(e => e.pos === cell.pos);
  if (!targetEntry) return false;
  const targetCol = targetEntry.col;

  // Every unique cell spanning targetCol (except the target) needs colspan+1
  const toExpand = [];
  const seen = new Set();
  for (const entry of cellMap) {
    if (entry.pos === cell.pos || seen.has(entry.pos)) continue;
    if (entry.col <= targetCol && entry.col + entry.colspan - 1 >= targetCol) {
      toExpand.push(entry);
      seen.add(entry.pos);
    }
  }

  try {
    const tr = editor.state.tr;
    const cellType = cell.node.type;
    const defaults = {};
    for (const k of Object.keys(cellType.attrs)) defaults[k] = cellType.attrs[k].default;
    const newCell = cellType.createAndFill({ ...defaults, rowspan: cell.node.attrs.rowspan || 1 });
    if (!newCell) return false;

    tr.insert(cell.pos + cell.node.nodeSize, newCell);
    for (const entry of toExpand) {
      const mp = tr.mapping.map(entry.pos);
      tr.setNodeMarkup(mp, null, { ...entry.node.attrs, colspan: entry.colspan + 1 });
    }
    editor.view.dispatch(tr);
    return true;
  } catch(e) {
    tableDbg('splitCellVertically error', e.message);
    return false;
  }
}

function _splitCellHorizontally() {
  const cell = findCellAtPos(editor.state.selection.from);
  if (!cell) return false;
  const table = findTableAroundPos(editor.state.selection.from);
  if (!table) return false;
  const { rowspan } = cell.node.attrs;

  // Merged cell (rowspan > 1): reduce rowspan by 1, insert new cell below
  if (rowspan > 1) {
    const cellMap = _buildTableMap(table);
    const targetEntry = cellMap.find(e => e.pos === cell.pos);
    if (!targetEntry) return false;

    // Find the last row this cell spans into and insert the new cell there
    const lastSpanRow = targetEntry.row + rowspan - 1;
    let rowEndPos = null;
    let ri = 0;
    table.node.forEach((rowNode, rowOffset) => {
      if (ri === lastSpanRow) rowEndPos = table.start + 1 + rowOffset;
      ri++;
    });
    if (rowEndPos === null) return false;

    try {
      const targetRow = table.node.child(lastSpanRow);
      let insertPos = rowEndPos + 1;
      let col = 0;
      targetRow.forEach((cn, cellOffset) => {

// Pure DOM approach: caption state lives in the DOM, not ProseMirror attributes.
// Captions are serialized via getContent() and restored via setContent().

    if (wrapper) _captionStore.set(wrapper, capDiv.textContent || '');
    clearTimeout(_contentTimer);
    _contentTimer = setTimeout(() => {
      try { window.webkit.messageHandlers.contentChanged.postMessage(window.editorBridge.getContent()); } catch(e) {}
    }, 300);
  });
  capDiv.addEventListener('mousedown', e => e.stopPropagation());
  capDiv.addEventListener('touchstart', e => e.stopPropagation());
  capDiv.addEventListener('keydown', e => e.stopPropagation());
  capDiv.addEventListener('focus', () => {
    tableDbg('captionInput.focus');
    editor.view.dom.removeEventListener('blur', refocusEditorIfNeeded);
  });
  capDiv.addEventListener('blur', () => {
    tableDbg('captionInput.blur', { textLen: (capDiv.textContent || '').length });
    editor.view.dom.addEventListener('blur', refocusEditorIfNeeded);
  });
}

function _restoreCaptionsAfterRender() {
  let restored = 0;
  document.querySelectorAll('.tiptap .tableWrapper').forEach(wrapper => {
    const saved = _captionStore.get(wrapper);
    if (saved !== undefined && !Array.from(wrapper.children).find(ch => ch.classList && ch.classList.contains('table-caption-box'))) {
      const tableEl = wrapper.querySelector('table');
      if (!tableEl) return;
      const capDiv = document.createElement('div');
      capDiv.className = 'table-caption-box';
      capDiv.contentEditable = 'true';
      capDiv.textContent = saved;
      wrapper.insertBefore(capDiv, tableEl);
      _setupCaptionInput(capDiv);

    // Enforce single-grid: if tapping a cell in a different table, clear first
    const tbl = cell.closest('table');
    if (tbl && _selectTable && tbl !== _selectTable) {
      clearSelection();
    }

    anchorCellDOM = cell;
    _isDragging = false;
    const anchorPos = cellPosFromDOM(cell);
    const anchorWasSelected = anchorPos !== null && selectedPositions.has(anchorPos);
    _dragMode = anchorWasSelected ? 'deselect' : 'select';
    _preRectSelection = new Set(selectedPositions);

    editor.view.dom.blur();
    if (document.activeElement && document.activeElement !== document.body) {
      document.activeElement.blur();
    }
  }, { capture: true });

  ec.addEventListener('pointermove', (e) => {
    if (!window._cellSelectMode || !anchorCellDOM) return;
    _lastPointerX = e.clientX;
    _lastPointerY = e.clientY;
    const el = document.elementFromPoint(e.clientX, e.clientY);
    if (el) {
      const cell = el.closest('.tiptap td, .tiptap th');
      if (cell) {
        _isDragging = true;
        selectRectMode(anchorCellDOM, cell);
      }
    }
    e.preventDefault();
    _startEdgeScroll();
  }, { capture: true });

  ec.addEventListener('pointerup', () => {
    if (!window._cellSelectMode) return;
    _stopEdgeScroll();
    if (anchorCellDOM && !_isDragging) {
      toggleCell(anchorCellDOM);
    }
    anchorCellDOM = null;
    _isDragging = false;
    _dragMode = null;
    _preRectSelection = null;
  }, { capture: true });

  ec.addEventListener('pointercancel', () => {
    _stopEdgeScroll();
    anchorCellDOM = null;
    _isDragging = false;
    _dragMode = null;
    _preRectSelection = null;
  }, { capture: true });

  window._enterCellSelectMode = function() {
    window._cellSelectMode = true;
    cellDbg('enterSelectMode');
    // Dismiss keyboard: blur every focusable element and clear selection
    editor.view.dom.blur();
    if (document.activeElement && document.activeElement !== document.body) {
      document.activeElement.blur();
    }
    const sel = window.getSelection();
    if (sel) sel.removeAllRanges();
    const wrapper = getTableDOMWrapper();
    if (wrapper) {
      const tbl = wrapper.querySelector('table');
      if (tbl) tbl.classList.add('cell-select-active');
    }
  };
  window._exitCellSelectMode = function() {
    cellDbg('exitSelectMode', { selectedSize: selectedPositions.size });
    clearSelection();
    window._cellSelectMode = false;
    document.querySelectorAll('.tiptap table.cell-select-active').forEach(t => t.classList.remove('cell-select-active'));
    editor.commands.focus();
  };

  window._getSelectedPositions = () => selectedPositions;
  window._clearCellSelection = clearSelection;
  window._addCellByPos = addByPos;
})();

// --- 6. Cell Properties Popup ---
const _cellPropsPopup = document.createElement('div');
_cellPropsPopup.className = 'cell-props-popup';
document.body.appendChild(_cellPropsPopup);

(function buildCellPropsPopup() {
  const popup = _cellPropsPopup;

  function secLabel(text) {
    const l = document.createElement('div');
    l.className = 'props-section-label'; l.textContent = text;
    popup.appendChild(l);
  }

  function applyCellAttr(attr, value) {
    const selPositions = window._getSelectedPositions ? window._getSelectedPositions() : new Set();
    if (selPositions.size > 1) {
      // Build a single transaction so all changes are one undo step
      const tr = editor.state.tr;
      selPositions.forEach(cellPos => {
        try {
          const mappedPos = tr.mapping.map(cellPos);
          const node = tr.doc.nodeAt(mappedPos);
          if (node && (node.type.name === 'tableCell' || node.type.name === 'tableHeader')) {
            tr.setNodeMarkup(mappedPos, null, { ...node.attrs, [attr]: value });
          }
        } catch(e) {}
      });
      editor.view.dispatch(tr);
    } else {
      editor.chain().focus().setCellAttribute(attr, value).run();
    }
    updateCellPropsPopupState();
  }

  // Background color
  secLabel('Background Color');
  const bgGrid = document.createElement('div');
  bgGrid.className = 'props-color-grid';
  const bgClear = document.createElement('div');
  bgClear.className = 'props-color-swatch clear-swatch';
  bgClear.addEventListener('pointerdown', (e) => { e.preventDefault(); e.stopPropagation(); applyCellAttr('backgroundColor', null); });
  bgGrid.appendChild(bgClear);
  COLORS.forEach(c => {
    const sw = document.createElement('div');
    sw.className = 'props-color-swatch';
    sw.style.background = c; sw.dataset.color = c;
    sw.addEventListener('pointerdown', (e) => { e.preventDefault(); e.stopPropagation(); applyCellAttr('backgroundColor', c); });
    bgGrid.appendChild(sw);
  });
  popup.appendChild(bgGrid);

  // Horizontal alignment
  secLabel('Horizontal Alignment');
  const hAlignRow = document.createElement('div');
  hAlignRow.className = 'props-btn-row';
  ['left', 'center', 'right', 'justify'].forEach(val => {
    const b = document.createElement('div');
    b.className = 'props-btn'; b.textContent = val.charAt(0).toUpperCase() + val.slice(1);
    b.dataset.align = val;
    b.addEventListener('pointerdown', (e) => { e.preventDefault(); e.stopPropagation(); applyCellAttr('textAlign', val); });
    hAlignRow.appendChild(b);
  });
  popup.appendChild(hAlignRow);

  // Vertical alignment
  secLabel('Vertical Alignment');
  const vAlignRow = document.createElement('div');
  vAlignRow.className = 'props-btn-row';
  ['top', 'middle', 'bottom'].forEach(val => {
    const b = document.createElement('div');
    b.className = 'props-btn'; b.textContent = val.charAt(0).toUpperCase() + val.slice(1);
    b.dataset.valign = val;
    b.addEventListener('pointerdown', (e) => { e.preventDefault(); e.stopPropagation(); applyCellAttr('verticalAlign', val); });
    vAlignRow.appendChild(b);
  });
  popup.appendChild(vAlignRow);

  // Cell padding
  secLabel('Padding');
  const padRow = document.createElement('div');
  padRow.className = 'props-btn-row';
  [{ label: 'None', val: '2px' }, { label: 'Small', val: '4px 8px' }, { label: 'Normal', val: '6px 10px' }, { label: 'Large', val: '12px 16px' }].forEach(opt => {
    const b = document.createElement('div');
    b.className = 'props-btn'; b.textContent = opt.label; b.dataset.pad = opt.val;
    b.addEventListener('pointerdown', (e) => { e.preventDefault(); e.stopPropagation(); applyCellAttr('cellPadding', opt.val); });
    padRow.appendChild(b);
  });
  popup.appendChild(padRow);

  // Border style (also sets borderWidth so all 4 sides render)
  secLabel('Border');
  const borderRow = document.createElement('div');
  borderRow.className = 'props-btn-row';
  [{ label: '1px solid', w: '1px', s: 'solid' },
   { label: '2px solid', w: '2px', s: 'solid' },
   { label: '2px dashed', w: '2px', s: 'dashed' },
   { label: '2px dotted', w: '2px', s: 'dotted' },
   { label: 'None', w: null, s: 'none' }].forEach(opt => {
    const b = document.createElement('div');
    b.className = 'props-btn'; b.textContent = opt.label;
    b.dataset.bwidth = opt.w || '';
    b.dataset.bstyle = opt.s;
    b.addEventListener('pointerdown', (e) => {
      e.preventDefault(); e.stopPropagation();
      applyCellAttr('borderWidth', opt.w);
      applyCellAttr('borderStyle', opt.s);
    });
    borderRow.appendChild(b);
  });
  popup.appendChild(borderRow);

  // Border color
  secLabel('Border Color');
  const bdGrid = document.createElement('div');
  bdGrid.className = 'props-color-grid';
  const bdClear = document.createElement('div');
  bdClear.className = 'props-color-swatch clear-swatch';
  bdClear.addEventListener('pointerdown', (e) => { e.preventDefault(); e.stopPropagation(); applyCellAttr('borderColor', null); });
  bdGrid.appendChild(bdClear);
  COLORS.forEach(c => {
    const sw = document.createElement('div');
    sw.className = 'props-color-swatch';
    sw.style.background = c; sw.dataset.bcolor = c;
    sw.addEventListener('pointerdown', (e) => { e.preventDefault(); e.stopPropagation(); applyCellAttr('borderColor', c); });
    bdGrid.appendChild(sw);
  });
  popup.appendChild(bdGrid);

  // Clear all
  const clearBtn = document.createElement('div');
  clearBtn.className = 'props-clear-btn'; clearBtn.textContent = 'Reset Cell Formatting';
  clearBtn.addEventListener('pointerdown', (e) => {
    e.preventDefault(); e.stopPropagation();
    ['backgroundColor', 'textAlign', 'verticalAlign', 'borderWidth', 'borderColor', 'borderStyle', 'cellPadding'].forEach(a => {
      applyCellAttr(a, null);
    });
  });
  popup.appendChild(clearBtn);
})();

function updateCellPropsPopupState() {
  try {
    const cell = findCellAtPos(editor.state.selection.from);
    if (!cell) return;
    const attrs = cell.node.attrs;
    _cellPropsPopup.querySelectorAll('.props-color-grid').forEach((grid, idx) => {
      const attrName = idx === 0 ? 'backgroundColor' : 'borderColor';
      const val = attrs[attrName] || null;
      grid.querySelectorAll('.props-color-swatch').forEach(sw => {
        sw.classList.toggle('active', sw.dataset.color === val || sw.dataset.bcolor === val);
      });
    });
    _cellPropsPopup.querySelectorAll('[data-align]').forEach(b => b.classList.toggle('active', b.dataset.align === (attrs.textAlign || '')));
    _cellPropsPopup.querySelectorAll('[data-valign]').forEach(b => b.classList.toggle('active', b.dataset.valign === (attrs.verticalAlign || '')));
    _cellPropsPopup.querySelectorAll('[data-pad]').forEach(b => b.classList.toggle('active', b.dataset.pad === (attrs.cellPadding || '')));
    _cellPropsPopup.querySelectorAll('[data-bstyle]').forEach(b => {
      const matchW = b.dataset.bwidth === (attrs.borderWidth || '');
      const matchS = b.dataset.bstyle === (attrs.borderStyle || '');
      b.classList.toggle('active', matchW && matchS);
    });
  } catch (e) {}
}

document.addEventListener('click', (e) => {
  const pp = _cellPropsPopup;
  if (!pp.classList.contains('visible')) return;
  if (!pp.contains(e.target) && !_cellPropsBtn.contains(e.target) && !_tableCtxBar.contains(e.target)) hideCellPropsPopup(pp);
});

// ═══════════════════════════════════════════════════════════════
// END TABLE FEATURES
// ═══════════════════════════════════════════════════════════════

try { window.webkit.messageHandlers.editorReady.postMessage('ready'); } catch(e) {}
try {
  const _ecScroll = document.getElementById('editor-container');
  if (_ecScroll) {
    const verticallyScrollable = _ecScroll.scrollHeight > _ecScroll.clientHeight + 1;
    window.webkit.messageHandlers.editorScroll.postMessage({
      scrollTop: _ecScroll.scrollTop,
      verticallyScrollable: verticallyScrollable
    });
  }
} catch (e) {}
</script>
</body>
