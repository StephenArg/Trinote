<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1c1c1e" media="(prefers-color-scheme: dark)">
<style>
:root {
  --bg: #ffffff;
  --fg: #1c1c1e;
  --toolbar-bg: #f2f2f7;
  --toolbar-border: #c6c6c8;
  --btn-bg: transparent;
  --btn-active: #007aff;
  --btn-active-bg: rgba(0,122,255,0.12);
  --editor-bg: #ffffff;
  --border: #e5e5ea;
  --placeholder: #8e8e93;
  --popup-bg: #ffffff;
  --popup-shadow: rgba(0,0,0,0.15);
  --table-border: #d1d1d6;
  --icon-filter: brightness(0);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1c1c1e;
    --fg: #aaaaaa;
    --toolbar-bg: #2c2c2e;
    --toolbar-border: #38383a;
    --btn-active-bg: rgba(10,132,255,0.2);
    --btn-active: #0a84ff;
    --editor-bg: #1c1c1e;
    --border: #38383a;
    --placeholder: #636366;
    --popup-bg: #2c2c2e;
    --popup-shadow: rgba(0,0,0,0.4);
    --table-border: #48484a;
    --icon-filter: brightness(0) invert(0.67);
  }
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { color-scheme: light dark; }
html, body {
  height: 100%;
  min-height: 100%;
  min-height: -webkit-fill-available;
  overflow: hidden;
  background: var(--bg);
  color: var(--fg);
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
}
body { display: flex; flex-direction: column; }

/* Toolbar — full natural height; horizontal scroll only inside the strip */
.toolbar-wrap {
  flex-shrink: 0; border-bottom: 1px solid var(--toolbar-border); background: var(--toolbar-bg);
  overflow-x: hidden; overflow-y: visible;
  /* Subpixel / WK clipping: avoid the first row of controls being sheared at the top */
  padding-top: 2px;
}
.toolbar {
  display: flex; flex-wrap: nowrap; align-items: center; gap: 1px;
  padding: 4px 6px;
  min-height: 42px;
  overflow-x: auto; overflow-y: visible;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior-y: none;
  touch-action: pan-x;
  -webkit-user-select: none;
  user-select: none;
}
.toolbar::-webkit-scrollbar { display: none; }
.toolbar button {
  flex-shrink: 0; border: none; background: var(--btn-bg);
  color: var(--fg); font-size: 15px; font-weight: 600;
  width: 36px; min-height: 34px; border-radius: 6px;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; -webkit-tap-highlight-color: transparent;
}
.toolbar button:active { opacity: 0.6; }
.toolbar button.active { color: var(--btn-active); background: var(--btn-active-bg); }
.toolbar button svg { width: 18px; height: 18px; fill: currentColor; }
/* Small dropdown hint next to icon (lists, colors, callout) */
.toolbar button svg.toolbar-btn-chevron {
  width: 11px;
  height: 11px;
  flex-shrink: 0;
  fill: currentColor;
}
.toolbar button.toolbar-btn-with-chevron {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 2px;
  width: auto;
  min-width: 40px;
  padding: 0 5px;
}
.toolbar button.toolbar-btn-with-chevron img.icon {
  flex-shrink: 0;
  width: 18px;
  height: 18px;
}
/* Callout toolbar: larger info glyph */
.toolbar button.toolbar-callout-btn svg:first-of-type {
  width: 23px;
  height: 23px;
}
.toolbar button.toolbar-font-size-btn svg.toolbar-font-size-icon {
  width: 18px;
  height: 18px;
  flex-shrink: 0;
}
.toolbar button img.icon { width: 18px; height: 18px; object-fit: contain; filter: var(--icon-filter); }
.toolbar button .toolbar-code-glyph {
  font-size: 12px;
  font-weight: 700;
  font-family: ui-monospace, "SF Mono", Menlo, monospace;
  letter-spacing: -0.12em;
  line-height: 1;
  user-select: none;
}
.toolbar .sep { width: 1px; height: 22px; background: var(--toolbar-border); margin: 0 3px; flex-shrink: 0; }
.toolbar select {
  flex-shrink: 0; border: 1px solid var(--border); background: var(--toolbar-bg);
  color: var(--fg); font-size: 13px; height: 34px; border-radius: 6px; padding: 0 6px;
  -webkit-appearance: none; appearance: none; cursor: pointer;
}

/* Color popup — fixed to viewport (appended to body) so toolbar overflow never clips or scrolls it */
.color-popup {
  display: none; position: fixed; left: 0; top: 0; z-index: 10000;
  background: var(--popup-bg); border: 1px solid var(--border); border-radius: 10px;
  padding: 8px; box-shadow: 0 4px 20px var(--popup-shadow);
  /* 7×30px swatches + gaps; avoids 0×0 first-paint layout on WKWebView */
  min-width: 248px;
  max-height: min(70vh, 420px); overflow-y: auto; -webkit-overflow-scrolling: touch;
}
.color-popup.visible { display: block; }
/* Callout / admonition picker (same positioning model as .color-popup) */
.callout-popup {
  display: none; position: fixed; left: 0; top: 0; z-index: 10000;
  background: var(--popup-bg); border: 1px solid var(--border); border-radius: 12px;
  padding: 8px; box-shadow: 0 4px 20px var(--popup-shadow);
  min-width: 220px; max-width: min(92vw, 320px);
}
.callout-popup.visible { display: block; }
/* Link editor popup (anchored like color / callout) */
.link-popup {
  display: none; position: fixed; left: 0; top: 0; z-index: 10000;
  background: var(--popup-bg); border: 1px solid var(--border); border-radius: 12px;
  padding: 12px; box-shadow: 0 4px 20px var(--popup-shadow);
  min-width: min(92vw, 300px); max-width: min(92vw, 360px);
}
.link-popup.visible { display: block; }
/* Font size picker (same positioning / dismiss model as .callout-popup) */
.font-size-popup {
  display: none; position: fixed; left: 0; top: 0; z-index: 10000;
  background: var(--popup-bg); border: 1px solid var(--border); border-radius: 12px;
  padding: 8px; box-shadow: 0 4px 20px var(--popup-shadow);
  min-width: 200px; max-width: min(92vw, 300px);
}
.font-size-popup.visible { display: block; }
.font-size-popup .text-tiny { font-size: 0.7em; }
.font-size-popup .text-small { font-size: 0.85em; }
.font-size-popup .text-big { font-size: 1.4em; }
.font-size-popup .text-huge { font-size: 1.8em; }
/* Bullet / numbered list style picker */
.list-style-popup {
  display: none; position: fixed; left: 0; top: 0; z-index: 10000;
  background: var(--popup-bg); border: 1px solid var(--border); border-radius: 12px;
  padding: 8px; box-shadow: 0 4px 20px var(--popup-shadow);
  min-width: min(92vw, 280px); max-width: min(92vw, 340px);
}
.list-style-popup.visible { display: block; }
.list-style-row-label { font-size: 14px; font-weight: 600; line-height: 1.25; }
.list-style-row-hint { font-size: 12px; font-weight: 500; opacity: 0.65; margin-top: 2px; }
.link-popup label.link-popup-label {
  display: block; font-size: 12px; font-weight: 600; margin-bottom: 6px; opacity: 0.75; color: var(--fg);
}
.link-popup input.link-popup-input {
  width: 100%; box-sizing: border-box; padding: 10px 12px; font-size: 16px; line-height: 1.3;
  border-radius: 8px; border: 1px solid var(--border); background: var(--bg); color: var(--fg);
  -webkit-appearance: none; appearance: none;
}
.link-popup .link-popup-actions {
  display: flex; gap: 8px; margin-top: 12px;
}
.link-popup .link-popup-actions button {
  flex: 1; border: none; border-radius: 8px; padding: 10px 12px; font-size: 15px; font-weight: 600;
  cursor: pointer; -webkit-tap-highlight-color: transparent; touch-action: manipulation;
}
.link-popup .link-popup-apply {
  background: var(--btn-active); color: #fff;
}
.link-popup .link-popup-remove {
  background: var(--border); color: var(--fg);
}
.callout-row {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 12px; margin: 3px 0; border-radius: 10px;
  border: 1px solid var(--border); cursor: pointer;
  font-size: 15px; font-weight: 600; color: var(--fg);
  -webkit-tap-highlight-color: transparent; touch-action: manipulation;
}
.callout-row:active { opacity: 0.75; }
.callout-row .callout-row-icon { flex-shrink: 0; width: 22px; height: 22px; display: flex; align-items: center; justify-content: center; }
.callout-row .callout-row-icon svg { width: 20px; height: 20px; }
.color-grid { display: grid; grid-template-columns: repeat(7, 30px); gap: 4px; }
.color-swatch {
  width: 30px; height: 30px; border-radius: 6px; border: 2px solid transparent;
  cursor: pointer; -webkit-tap-highlight-color: transparent;
}
.color-swatch:active { opacity: 0.7; }
.color-swatch.clear-color { border: 2px solid var(--border); position: relative; }
.color-swatch.clear-color::after {
  content: ''; position: absolute; top: 50%; left: 0; width: 100%; height: 2px;
  background: red; transform: rotate(-45deg);
}

/* Editor area — extra bottom padding so the last lines aren’t tight against the keyboard */
#editor-container {
  flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; cursor: text;
  background: var(--editor-bg);
  padding-bottom: max(25px, calc(env(safe-area-inset-bottom, 0px) + 20px));
}
.tiptap {
  padding: 16px 16px 20px; outline: none; min-height: 100%; font-size: 16px; line-height: 1.6; color: var(--fg);
  background: var(--editor-bg);
}
.tiptap p { margin: 0.4em 0; }
.tiptap h1 { font-size: 1.8em; margin: 0.6em 0 0.3em; }
.tiptap h2 { font-size: 1.5em; margin: 0.5em 0 0.3em; }
.tiptap h3 { font-size: 1.3em; margin: 0.5em 0 0.3em; }
.tiptap h4 { font-size: 1.15em; margin: 0.4em 0 0.2em; }
.tiptap h5 { font-size: 1.05em; margin: 0.4em 0 0.2em; }
.tiptap h6 { font-size: 1em; margin: 0.4em 0 0.2em; }
.tiptap ul, .tiptap ol { padding-left: 24px; }
.tiptap ul[data-type="taskList"] { list-style: none; padding-left: 4px; }
/* Use > li (not [data-type=taskItem]) so every task row keeps checkbox + text on one line */
.tiptap ul[data-type="taskList"] > li {
  display: flex;
  align-items: flex-start;
  gap: 8px;
}
.tiptap ul[data-type="taskList"] > li > label {
  flex-shrink: 0;
  /* Slightly lower than before (was 3px) so checkbox lines up with first line of text */
  margin-top: 5px;
}
.tiptap ul[data-type="taskList"] > li > label input[type="checkbox"] {
  margin: 0;
  vertical-align: top;
  accent-color: var(--btn-active);
  cursor: pointer;
}
/* TipTap puts copy in div > p; dropping first-p top margin avoids text sitting low vs checkbox */
.tiptap ul[data-type="taskList"] > li > div > p:first-child { margin-top: 0; }
.tiptap ul[data-type="taskList"] > li > p:first-child { margin-top: 0; }
.tiptap blockquote { border-left: 4px solid var(--border); margin: 0.5em 0; padding: 4px 16px; opacity: 0.85; }
/* TriliumNext CKEditor admonitions: <aside class="admonition note">… — plus legacy div[data-callout-type] */
.tiptap aside.admonition { margin: 0.65em 0; border-radius: 10px; padding: 10px 12px 10px 14px; border: 1px solid; background: rgba(128,128,128,0.06); display: block; }
.tiptap aside.admonition > *:first-child { margin-top: 0; }
.tiptap aside.admonition > *:last-child { margin-bottom: 0; }
.tiptap aside.admonition.note, .tiptap div[data-callout-type="note"] { border-color: #4a9eff; }
.tiptap aside.admonition.note::before, .tiptap div[data-callout-type="note"]::before {
  content: "Note"; display: block; font-weight: 700; font-size: 0.82em; letter-spacing: 0.02em;
  margin-bottom: 6px; color: #4a9eff;
}
.tiptap aside.admonition.tip, .tiptap div[data-callout-type="tip"] { border-color: #3fb950; }
.tiptap aside.admonition.tip::before, .tiptap div[data-callout-type="tip"]::before {
  content: "Tip"; display: block; font-weight: 700; font-size: 0.82em; margin-bottom: 6px; color: #3fb950;
}
.tiptap aside.admonition.important, .tiptap div[data-callout-type="important"] { border-color: #a371f7; }
.tiptap aside.admonition.important::before, .tiptap div[data-callout-type="important"]::before {
  content: "Important"; display: block; font-weight: 700; font-size: 0.82em; margin-bottom: 6px; color: #a371f7;
}
.tiptap aside.admonition.caution, .tiptap div[data-callout-type="caution"] { border-color: #f85149; }
.tiptap aside.admonition.caution::before, .tiptap div[data-callout-type="caution"]::before {
  content: "Caution"; display: block; font-weight: 700; font-size: 0.82em; margin-bottom: 6px; color: #f85149;
}
.tiptap aside.admonition.warning, .tiptap div[data-callout-type="warning"] { border-color: #d29922; }
.tiptap aside.admonition.warning::before, .tiptap div[data-callout-type="warning"]::before {
  content: "Warning"; display: block; font-weight: 700; font-size: 0.82em; margin-bottom: 6px; color: #d29922;
}
@media (prefers-color-scheme: dark) {
  .tiptap aside.admonition, .tiptap div[data-callout-type] { background: rgba(255,255,255,0.05); }
}
.tiptap pre { background: rgba(128,128,128,0.1); padding: 12px; border-radius: 8px; overflow-x: auto; font-size: 14px; font-family: "SF Mono", Menlo, monospace; }
.tiptap code { background: rgba(128,128,128,0.1); padding: 2px 6px; border-radius: 4px; font-size: 14px; font-family: "SF Mono", Menlo, monospace; }
.tiptap pre code { background: none; padding: 0; }
.tiptap img { max-width: 100%; height: auto; border-radius: 6px; }
.tiptap hr { border: none; border-top: 2px solid var(--border); margin: 1em 0; }
.tiptap a { color: var(--btn-active); text-decoration: underline; }
/* TipTap Highlight → <mark>; ensure multicolor backgrounds paint (esp. WebKit / line wraps) */
.tiptap mark {
  -webkit-box-decoration-break: clone;
  box-decoration-break: clone;
  border-radius: 2px;
  padding: 0.05em 0;
}
.tiptap table { border-collapse: collapse; width: 100%; margin: 0.5em 0; }
.tiptap th, .tiptap td { border: 1px solid var(--table-border); padding: 6px 10px; min-width: 60px; vertical-align: top; }
.tiptap th { background: rgba(128,128,128,0.08); font-weight: 600; }
.tiptap .selectedCell { background: var(--btn-active-bg); }
.tiptap p.is-editor-empty:first-child::before {
  content: attr(data-placeholder); color: var(--placeholder); float: left; height: 0; pointer-events: none;
}
/* Trilium / CKEditor font-size classes (relative to parent, same ratios as ck-content) */
.tiptap .text-tiny { font-size: 0.7em; }
.tiptap .text-small { font-size: 0.85em; }
.tiptap .text-big { font-size: 1.4em; }
.tiptap .text-huge { font-size: 1.8em; }

/* Loading state */
#loading { display: flex; align-items: center; justify-content: center; height: 100%; color: var(--placeholder); font-size: 15px; }
</style>
</head>
<body>

<div class="toolbar-wrap" id="toolbar-wrap" style="display:none">
<div class="toolbar" id="toolbar"></div>
</div>
<div id="editor-container">
  <div id="loading">Loading editor…</div>
  <div id="editor" style="display:none"></div>
</div>

<script src="tiptap-bundle.min.js"></script>
<script src="callout-extension.js"></script>
<script src="font-size-extension.js"></script>
<script src="list-styles-extension.js"></script>
<script>
if (typeof TipTap === 'undefined') {
  const le = document.getElementById('loading');
  if (le) le.textContent = 'Could not load editor scripts. If they live in editor-vendor/, update the <script src> paths in editor.html.';
  try { window.webkit.messageHandlers.editorReady.postMessage('ready'); } catch (e) {}
  throw new Error('TipTap bundle missing');
}
const { Editor, StarterKit, Underline, TextAlign, Color, TextStyle, Highlight, Table, TableRow, TableCell, TableHeader, Link, TaskList, TaskItem, Placeholder, Subscript, Superscript, Image } = TipTap;
const CalloutExt = (typeof TipTapCallout !== 'undefined' && TipTapCallout && TipTapCallout.Callout) ? TipTapCallout.Callout : null;
const FontSizeExt = (typeof TipTapTriliumFontSize !== 'undefined' && TipTapTriliumFontSize && TipTapTriliumFontSize.TriliumFontSize) ? TipTapTriliumFontSize.TriliumFontSize : null;
const ListStylesMod = (typeof TipTapListStyles !== 'undefined' && TipTapListStyles) ? TipTapListStyles : null;
const TriliumBulletListExt = ListStylesMod && ListStylesMod.TriliumBulletList ? ListStylesMod.TriliumBulletList : null;
const TriliumOrderedListExt = ListStylesMod && ListStylesMod.TriliumOrderedList ? ListStylesMod.TriliumOrderedList : null;
const useTriliumListStyles = !!(TriliumBulletListExt && TriliumOrderedListExt);

const COLORS = [
  '#000000','#434343','#666666','#999999','#b7b7b7','#cccccc','#ffffff',
  '#980000','#ff0000','#ff9900','#ffff00','#00ff00','#00ffff','#0000ff',
  '#9900ff','#ff00ff','#e6b8af','#f4cccc','#fce5cd','#fff2cc','#d9ead3',
  '#d0e0e3','#cfe2f3','#d9d2e9','#ead1dc',
];

const FONT_SIZE_KINDS = [
  { id: 'tiny', label: 'Tiny' },
  { id: 'small', label: 'Small' },
  { id: 'default', label: 'Default' },
  { id: 'big', label: 'Big' },
  { id: 'huge', label: 'Huge' },
];

/* CKEditor / Trilium list properties (list-style-type on ul / ol) */
const BULLET_LIST_STYLE_OPTIONS = [
  { id: 'disc', label: 'Disc', hint: '• Default bullet' },
  { id: 'circle', label: 'Circle', hint: '○ Hollow bullet' },
  { id: 'square', label: 'Square', hint: '■ Square bullet' },
];
const ORDERED_LIST_STYLE_OPTIONS = [
  { id: 'decimal', label: 'Decimal', hint: '1, 2, 3' },
  { id: 'decimal-leading-zero', label: 'Decimal (leading zero)', hint: '01, 02, 03' },
  { id: 'lower-latin', label: 'Lower Latin', hint: 'a, b, c' },
  { id: 'upper-latin', label: 'Upper Latin', hint: 'A, B, C' },
  { id: 'lower-roman', label: 'Lower Roman', hint: 'i, ii, iii' },
  { id: 'upper-roman', label: 'Upper Roman', hint: 'I, II, III' },
];

let _contentTimer = null;
let _toolbarScheduled = false;

const editorExtensions = [
  StarterKit.configure({
    heading: { levels: [1,2,3,4,5,6] },
    ...(useTriliumListStyles ? { bulletList: false, orderedList: false } : {}),
  }),
  Underline,
  TextStyle,
  Color,
  Highlight.configure({ multicolor: true }),
  TextAlign.configure({ types: ['heading','paragraph'] }),
  Table.configure({ resizable: false }),
  TableRow,
  TableCell,
  TableHeader,
  Link.configure({ openOnClick: false, HTMLAttributes: { rel: null, target: null } }),
  TaskList,
  TaskItem.configure({ nested: true }),
  Placeholder.configure({ placeholder: 'Start writing…' }),
  Subscript,
  Superscript,
  Image.configure({ inline: true, allowBase64: true, HTMLAttributes: { class: '' } }),
];
if (CalloutExt) editorExtensions.push(CalloutExt);
if (FontSizeExt) editorExtensions.push(FontSizeExt);
if (useTriliumListStyles) {
  editorExtensions.push(TriliumBulletListExt);
  editorExtensions.push(TriliumOrderedListExt);
}

const editor = new Editor({
  element: document.getElementById('editor'),
  extensions: editorExtensions,
  content: '',
  onUpdate({ editor }) {
    clearTimeout(_contentTimer);
    _contentTimer = setTimeout(() => {
      try { window.webkit.messageHandlers.contentChanged.postMessage(tiptapToCk(editor.getHTML())); } catch(e) {}
    }, 300);
  },
  onSelectionUpdate() { scheduleToolbarUpdate(); },
  onTransaction() { scheduleToolbarUpdate(); },
});

// WKWebView / iOS: tapping the toolbar blurs the editor and collapses the DOM selection.
// Keep the last ProseMirror ranged selection so color / highlight pickers can still apply.
let editorSavedRange = null;
editor.on('selectionUpdate', ({ editor }) => {
  const { from, to, empty } = editor.state.selection;
  if (!empty) editorSavedRange = { from, to };
});

// iOS: while the swatch panel is open, blur refocuses the editor so the keyboard can stay up.
// IMPORTANT: Do not refocus on a timer/hold — that runs when tapping the color *button* (before the
// panel is visible) and steals the tap so the synthetic click never opens the picker.
function refocusEditorIfNeeded() {
  if (!document.querySelector('.color-popup.visible') && !document.querySelector('.callout-popup.visible') && !document.querySelector('.font-size-popup.visible') && !document.querySelector('.list-style-popup.visible')) return;
  requestAnimationFrame(() => {
    try {
      if (editor.view && editor.view.dom) {
        editor.view.dom.focus({ preventScroll: true });
      }
    } catch (e) {}
  });
}
editor.view.dom.addEventListener('blur', refocusEditorIfNeeded);

// --- Toolbar Setup ---
const toolbar = document.getElementById('toolbar');
function ic(name) { return '<img class="icon" src="' + name + '" width="18" height="18" alt="" />'; }
const TOOLBAR_CHEVRON_SVG = '<svg class="toolbar-btn-chevron" width="10" height="10" viewBox="0 0 12 12" fill="currentColor" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M2 4l4 4 4-4"/></svg>';
/* Task list: inline SVG (viewBox 48×48); toolbar .toolbar button svg → ~18×18 like other icons */

/* Trilium font-size toolbar icon (viewBox 15×15; sized via .toolbar-font-size-icon) */

// Color pickers — restore range before applying marks (see editorSavedRange above).
// After applying a mark, scroll the selection into the area visible above the keyboard (visualViewport).
function scrollEditorRangeIntoView() {
  const ec = document.getElementById('editor-container');
  const view = editor.view;
  if (!ec || !view) return;
  const { from, to } = editor.state.selection;
  let topDoc, bottomDoc;
  try {
    const c1 = view.coordsAtPos(from);
    const c2 = view.coordsAtPos(to);
    topDoc = Math.min(c1.top, c2.top, c1.bottom, c2.bottom);
    bottomDoc = Math.max(c1.top, c2.top, c1.bottom, c2.bottom);
  } catch (e) {
    return;
  }
  const pad = 12;
  const ecRect = ec.getBoundingClientRect();
  let visibleTop = ecRect.top + pad;
  let visibleBottom = ecRect.bottom - pad;
  const vv = window.visualViewport;
  if (vv) {
    const vTop = vv.offsetTop + pad;
    const vBottom = vv.offsetTop + vv.height - pad;
    visibleTop = Math.max(visibleTop, vTop);
    visibleBottom = Math.min(visibleBottom, vBottom);
  }
  if (visibleBottom <= visibleTop) return;

  if (topDoc < visibleTop) {
    ec.scrollTop += topDoc - visibleTop;
  } else if (bottomDoc > visibleBottom) {
    ec.scrollTop += bottomDoc - visibleBottom;
  }
}

// iOS: keyboard / visualViewport settle after focus — scroll so the caret stays above the keys.
function scheduleScrollCaretIntoViewAfterKeyboard() {
  const bump = function () { scrollEditorRangeIntoView(); };
  bump();
  requestAnimationFrame(function () {
    bump();
    requestAnimationFrame(bump);
  });
  setTimeout(bump, 80);
  setTimeout(bump, 200);
  setTimeout(bump, 400);
  setTimeout(bump, 600);
  setTimeout(bump, 850);
  setTimeout(bump, 1100);
}

(function attachCaretScrollOnVisualViewport() {
  const vv = window.visualViewport;
  if (!vv) return;
  let debounceTimer = null;
  function onViewportChange() {
    try {
      if (!editor.view || !editor.view.hasFocus()) return;
    } catch (e) {
      return;
    }
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(function () {
      scrollEditorRangeIntoView();
    }, 50);
  }
  vv.addEventListener('resize', onViewportChange, { passive: true });
  vv.addEventListener('scroll', onViewportChange, { passive: true });
})();

editor.on('focus', function () {
  scheduleScrollCaretIntoViewAfterKeyboard();
});

function afterColorMarkEdit() {
  const dom = editor.view && editor.view.dom;
  if (dom) {
    try {
      dom.focus({ preventScroll: true });
    } catch (e) {
      dom.focus();
    }
  }
  const bump = () => scrollEditorRangeIntoView();
  bump();
  requestAnimationFrame(() => {
    bump();
    requestAnimationFrame(bump);
  });
  setTimeout(bump, 80);
  setTimeout(bump, 250);
  setTimeout(bump, 450);
}

function colorPickerApplyRange(wrapper) {
  const sel = editor.state.selection;
  if (!sel.empty) return { from: sel.from, to: sel.to };
  if (wrapper._rangeAtOpen && wrapper._rangeAtOpen.from !== wrapper._rangeAtOpen.to)
    return wrapper._rangeAtOpen;
  if (editorSavedRange && editorSavedRange.from !== editorSavedRange.to)
    return editorSavedRange;
  return null;
}

function markColorPopupJustOpened(popup) {

function layoutColorPopup(anchor, popup) {
  if (!popup.classList.contains('visible')) return;
  popup.style.visibility = 'hidden';
  popup.style.left = '0px';
  popup.style.top = '0px';
  const pr = popup.getBoundingClientRect();
  const ar = anchor.getBoundingClientRect();
  const margin = 8;
  let top = ar.bottom + 4;
  let left = ar.left;
  const pw = Math.max(pr.width, 1);
  const ph = Math.max(pr.height, 1);
  left = Math.max(margin, Math.min(left, window.innerWidth - pw - margin));
  if (top + ph > window.innerHeight - margin) {
    top = Math.max(margin, ar.top - ph - 4);
  }
  popup.style.left = `${Math.round(left)}px`;
  popup.style.top = `${Math.round(top)}px`;
  popup.style.visibility = '';
}

function makeColorPicker(title, icon, applyRangeFn, clearRangeFn) {
  const wrapper = document.createElement('div');

  b.type = 'button';

  b.style.cssText = 'flex-shrink:0;border:none;background:var(--btn-bg);color:var(--fg);font-size:15px;font-weight:600;min-width:40px;height:34px;padding:0 5px;border-radius:6px;display:flex;align-items:center;justify-content:center;gap:2px;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation;';
  const popup = document.createElement('div');
  popup.className = 'color-popup';
  popup._anchorButton = b;
  const grid = document.createElement('div');
  grid.className = 'color-grid';
  const clearBtn = document.createElement('div');
  clearBtn.className = 'color-swatch clear-color';
  clearBtn.title = 'Remove color';
  clearBtn.style.touchAction = 'manipulation';
  function runClear(e) {
    e.preventDefault();
    e.stopPropagation();
    const r = colorPickerApplyRange(wrapper);
    hideColorPopup(popup);
    if (!r) return;
    clearRangeFn(r.from, r.to);
  }
  clearBtn.addEventListener('pointerdown', runClear, true);
  clearBtn.addEventListener('click', (e) => { e.preventDefault(); e.stopPropagation(); });
  grid.appendChild(clearBtn);
  COLORS.forEach(c => {
    const sw = document.createElement('div');
    sw.className = 'color-swatch';
    sw.style.background = c;
    sw.style.touchAction = 'manipulation';
    function runApply(e) {
      e.preventDefault();
      e.stopPropagation();
      const r = colorPickerApplyRange(wrapper);
      hideColorPopup(popup);
      if (!r) return;
      applyRangeFn(r.from, r.to, c);
    }
    sw.addEventListener('pointerdown', runApply, true);
    sw.addEventListener('click', (e) => { e.preventDefault(); e.stopPropagation(); });
    grid.appendChild(sw);
  });
  popup.appendChild(grid);
  document.body.appendChild(popup);
  b.addEventListener('pointerdown', () => {
    const { from, to } = editor.state.selection;
    wrapper._rangeAtOpen = { from, to };
  }, true);
  b.addEventListener('click', (e) => {
    e.preventDefault();
    e.stopPropagation();
    const willOpen = !popup.classList.contains('visible');
    document.querySelectorAll('.color-popup.visible').forEach(p => { if (p !== popup) hideColorPopup(p); });
    document.querySelectorAll('.link-popup.visible').forEach(p => hideLinkPopup(p));
    document.querySelectorAll('.font-size-popup.visible').forEach(p => hideFontSizePopup(p));
    document.querySelectorAll('.list-style-popup.visible').forEach(p => hideListStylePopup(p));
    if (willOpen) {
      markColorPopupJustOpened(popup);
      popup.classList.add('visible');
      // Two rAFs: first layout pass can report 0×0 for the grid on iOS WKWebView
      requestAnimationFrame(() => {
        layoutColorPopup(b, popup);
        requestAnimationFrame(() => layoutColorPopup(b, popup));
      });
    } else {
      hideColorPopup(popup);
    }
  });
  wrapper.appendChild(b);
  toolbar.appendChild(wrapper);
  document.addEventListener('click', (e) => {
    if (!popup.classList.contains('visible')) return;
    if (performance.now() < (popup._ignoreOutsideUntil || 0)) return;
    if (!wrapper.contains(e.target) && !popup.contains(e.target)) hideColorPopup(popup);
  });
}

(function attachColorPopupDismiss() {

  window.addEventListener('resize', () => {
    document.querySelectorAll('.color-popup.visible').forEach(popup => {

    document.querySelectorAll('.link-popup.visible').forEach(popup => {
      const anchor = popup._anchorButton;

    document.querySelectorAll('.font-size-popup.visible').forEach(popup => {
      const anchor = popup._anchorButton;
      if (anchor && typeof layoutCalloutPopup === 'function') layoutCalloutPopup(anchor, popup);

function applyCalloutType(kind) {
  if (!CalloutExt) return;
  if (editor.isActive('callout')) {
    editor.chain().focus().setCalloutType(kind).run();
  } else {
    const ok = editor.chain().focus().wrapInCallout(kind).run();
    if (!ok) editor.chain().focus().insertCallout(kind).run();
  }
  const dom = editor.view && editor.view.dom;
  if (dom) {
    try { dom.focus({ preventScroll: true }); } catch (e) { dom.focus(); }
  }
  scrollEditorRangeIntoView();
  requestAnimationFrame(() => scrollEditorRangeIntoView());
  setTimeout(scrollEditorRangeIntoView, 120);
}

function normalizeLinkUrl(raw) {
  const t = (raw || '').trim();
  if (!t) return '';
  if (/^mailto:/i.test(t) || /^tel:/i.test(t)) return t;
  if (/^\/[\s\S]*/.test(t)) return t;
  if (/^[\w.-]+\.[a-z]{2,}([\/?#][^\s]*)?$/i.test(t) && !/^https?:\/\//i.test(t)) return 'https://' + t;
  return t;
}

// --- CKEditor ↔ TipTap HTML conversion ---
//
// CKEditor:  <ul class="todo-list"><li>
//              <label class="todo-list__label">
//                <input type="checkbox" disabled [checked]>
//                <span class="todo-list__label__description">text</span>
//              </label></li></ul>
//
// TipTap getHTML():  <ul data-type="taskList"><li data-type="taskItem" data-checked="false">
//                      <label><input type="checkbox"><span></span></label>
//                      <div><p>text</p></div></li></ul>
//
// TipTap setContent() expects:  <ul data-type="taskList">
//                                 <li data-type="taskItem" data-checked="false">text</li></ul>

// TriliumNext saves <aside class="admonition note"> (ckeditor5-admonition). TipTap callout parses that natively.
// Also: legacy div[data-callout-type], blockquote, GitHub markdown-alert → same <aside> shape for the editor.
function migrateTriliumAdmonitionsForTiptap(doc) {
  const types = ['note', 'tip', 'important', 'caution', 'warning'];
  function detectType(className) {
    if (!className) return null;
    const c = className.toLowerCase();
    for (const t of types) {
      if (c.includes('admonition-' + t) || c.includes('admonition_' + t)) return t;
      if (c.includes('callout-' + t) || c.includes('callout_' + t)) return t;
      if (c.includes('markdown-alert-' + t)) return t;
    }
    return null;
  }
  function makeAside(t) {
    const aside = doc.createElement('aside');
    aside.className = 'admonition ' + t;
    return aside;
  }
  doc.querySelectorAll('div[data-callout-type]').forEach(div => {
    const raw = (div.getAttribute('data-callout-type') || 'note').trim();
    const t = types.includes(raw) ? raw : 'note';
    const aside = makeAside(t);
    while (div.firstChild) aside.appendChild(div.firstChild);
    div.parentNode.replaceChild(aside, div);
  });
  doc.querySelectorAll('blockquote[class]').forEach(bq => {
    const t = detectType(bq.getAttribute('class'));
    if (!t) return;
    const aside = makeAside(t);
    while (bq.firstChild) aside.appendChild(bq.firstChild);
    bq.parentNode.replaceChild(aside, bq);
  });
  doc.querySelectorAll('div[class*="markdown-alert"]').forEach(div => {
    const t = detectType(div.getAttribute('class') || '') || 'note';
    const aside = makeAside(t);
    while (div.firstChild) aside.appendChild(div.firstChild);
    div.parentNode.replaceChild(aside, div);
  });
}

// Saved HTML must match Trilium desktop: <aside class="admonition TYPE"> (not div[data-callout-type]).
function normalizeCalloutsForTrilium(doc) {
  const types = ['note', 'tip', 'important', 'caution', 'warning'];
  doc.querySelectorAll('div[data-callout-type]').forEach(div => {
    const raw = (div.getAttribute('data-callout-type') || 'note').trim();
    const t = types.includes(raw) ? raw : 'note';
    const aside = doc.createElement('aside');
    aside.className = 'admonition ' + t;
    while (div.firstChild) aside.appendChild(div.firstChild);
    div.parentNode.replaceChild(aside, div);
  });
  doc.querySelectorAll('aside.admonition').forEach(aside => {
    const typeClass = types.find(tt => aside.classList.contains(tt));
    const t = typeClass || 'note';
    aside.className = 'admonition ' + t;
  });
}

// CKEditor / Trilium often use <span style="background-color:…">; TipTap Highlight expects <mark data-color>.
function migrateCkColorMarkupForTiptap(doc) {
  const body = doc.body;
  const spans = Array.from(body.querySelectorAll('span[style]')).reverse();
  spans.forEach(span => {
    if (!span.parentNode) return;
    const style = span.getAttribute('style') || '';
    const bgMatch = style.match(/background-color\s*:\s*([^;]+)/i);
    if (!bgMatch) return;
    const d = span.ownerDocument;
    const mark = d.createElement('mark');
    const bgVal = bgMatch[1].trim();
    mark.style.backgroundColor = bgVal;
    mark.setAttribute('data-color', bgVal);
    const colorMatch = style.match(/(?:^|;)\s*color\s*:\s*([^;]+)/i);
    if (colorMatch) {
      const inner = d.createElement('span');
      inner.setAttribute('style', 'color: ' + colorMatch[1].trim());
      while (span.firstChild) inner.appendChild(span.firstChild);
      mark.appendChild(inner);
    } else {
      while (span.firstChild) mark.appendChild(span.firstChild);
    }
    span.parentNode.replaceChild(mark, span);
  });
}

// TipTap saves <mark>; convert back to spans for CKEditor-compatible HTML / Trilium desktop.
function tiptapMarkToCkSpans(doc) {
  doc.querySelectorAll('mark').forEach(mark => {
    if (!mark.parentNode) return;
    const span = doc.createElement('span');
    const dc = mark.getAttribute('data-color');
    const st = mark.getAttribute('style') || '';
    const bgMatch = st.match(/background-color\s*:\s*([^;]+)/i);
    const bg = (dc || (bgMatch ? bgMatch[1].trim() : '')).trim();
    if (bg) span.style.backgroundColor = bg;
    while (mark.firstChild) span.appendChild(mark.firstChild);
    mark.parentNode.replaceChild(span, mark);
  });
}

function ckToTiptap(html) {
  if (!html) return html;
  const doc = new DOMParser().parseFromString(html, 'text/html');

  doc.querySelectorAll('ul.todo-list').forEach(ul => {
    ul.removeAttribute('class');
    ul.setAttribute('data-type', 'taskList');

    ul.querySelectorAll(':scope > li').forEach(li => {
      const cb = li.querySelector('input[type="checkbox"]');
      const checked = cb && cb.hasAttribute('checked') ? 'true' : 'false';
      li.setAttribute('data-type', 'taskItem');
      li.setAttribute('data-checked', checked);

      const desc = li.querySelector('.todo-list__label__description');
      const textHTML = desc ? desc.innerHTML : '';

      // Strip the entire CKEditor label; leave only plain inline text for TipTap to parse
      const label = li.querySelector('label.todo-list__label');
      if (label) label.remove();
      li.innerHTML = textHTML;
    });
  });

  migrateTriliumAdmonitionsForTiptap(doc);
  migrateCkColorMarkupForTiptap(doc);
  return doc.body.innerHTML;
}

function tiptapToCk(html) {
  if (!html) return html;
  const doc = new DOMParser().parseFromString(html, 'text/html');

  normalizeCalloutsForTrilium(doc);
  tiptapMarkToCkSpans(doc);

  doc.querySelectorAll('ul[data-type="taskList"]').forEach(ul => {
    ul.removeAttribute('data-type');
    ul.classList.add('todo-list');

    ul.querySelectorAll(':scope > li[data-type="taskItem"]').forEach(li => {
      const checked = li.getAttribute('data-checked') === 'true';
      li.removeAttribute('data-type');
      li.removeAttribute('data-checked');

      // Extract only the real text, stripping TipTap's own <label> and <div><p> wrappers
      const tiptapLabel = li.querySelector(':scope > label');
      if (tiptapLabel) tiptapLabel.remove();

      // Unwrap <div><p>text</p></div> → just "text"
      let textHTML = '';
      const contentDiv = li.querySelector(':scope > div');
      if (contentDiv) {
        const p = contentDiv.querySelector('p');
        textHTML = p ? p.innerHTML : contentDiv.innerHTML;
      } else {
        // Fallback: strip any remaining <p> wrappers
        const p = li.querySelector(':scope > p');
        textHTML = p ? p.innerHTML : li.innerHTML;
      }

      // Rebuild in CKEditor format
      const label = doc.createElement('label');
      label.className = 'todo-list__label';

      const cb = doc.createElement('input');
      cb.type = 'checkbox';
      cb.disabled = true;
      if (checked) cb.setAttribute('checked', 'checked');

      const span = doc.createElement('span');
      span.className = 'todo-list__label__description';
      span.innerHTML = textHTML;

      label.appendChild(cb);
      label.appendChild(span);
      li.innerHTML = '';
      li.appendChild(label);
    });
  });

  return doc.body.innerHTML;
}

// --- Bridge ---
window.editorBridge = {
  setContent(html) { editor.commands.setContent(ckToTiptap(html) || '', false); },
  getContent() {
    clearTimeout(_contentTimer);
    return tiptapToCk(editor.getHTML());
  },
  focus() {
    editor.commands.focus('end');
    scheduleScrollCaretIntoViewAfterKeyboard();
  },
  insertHTML(html) { editor.commands.insertContent(html); },
  insertImage(src) { editor.chain().focus().setImage({ src }).run(); },
};

// Show editor, hide loading
document.getElementById('loading').style.display = 'none';
document.getElementById('editor').style.display = 'block';
document.getElementById('toolbar-wrap').style.display = 'block';
updateToolbarState();

// First tap while unfocused: for very short notes, jump caret to end + keyboard (iOS WKWebView).
// If there are 2+ logical lines (blocks / hard breaks) or multiple top-level blocks, let the tap place the caret.
function editorDocumentHasFocus() {
  if (editor.isFocused === true) return true;
  try {
    return editor.view != null && editor.view.hasFocus();
  } catch (e) {
    return false;
  }
}
function shouldJumpCaretToEndOnFirstUnfocusedTap() {
  try {
    const doc = editor.state.doc;
    if (doc.childCount >= 2) return false;
    const plain = editor.getText({ blockSeparator: '\n' });
    const nonEmptyLines = plain.split('\n').filter(function (l) { return l.trim().length > 0; }).length;
    if (nonEmptyLines >= 2) return false;
    return true;
  } catch (err) {
    return true;
  }
}
document.getElementById('editor-container').addEventListener('click', function(e) {
  if (e.target.closest('a[href]')) return;
  if (editorDocumentHasFocus()) return;
  if (!shouldJumpCaretToEndOnFirstUnfocusedTap()) return;
  e.preventDefault();
  e.stopPropagation();
  editor.commands.focus('end');
  scheduleScrollCaretIntoViewAfterKeyboard();
}, true);

try { window.webkit.messageHandlers.editorReady.postMessage('ready'); } catch(e) {}
</script>
