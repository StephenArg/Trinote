<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<link rel="stylesheet" href="vendor/leaflet.css">
<script src="vendor/leaflet.js"></script>
<style>
* { margin: 0; padding: 0; -webkit-touch-callout: none; }
html, body { width: 100%; height: 100%; overflow: hidden; touch-action: none; position: relative; }
#map { width: 100%; height: 100%; position: absolute; top: 0; left: 0; right: 0; bottom: 0; }
</style>
</head>
<body>
<div id="map"></div>
<script>
(function() {
    var tileURL = 'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png';
    var defaultCenter = [0, 0];
    var defaultZoom = 2;
    var map = null;
    var markers = {};

    var defaultIcon = L.icon({
        iconUrl: 'vendor/images/marker-icon.png',
        iconRetinaUrl: 'vendor/images/marker-icon-2x.png',
        shadowUrl: 'vendor/images/marker-shadow.png',
        iconSize: [25, 41],
        iconAnchor: [12, 41],
        popupAnchor: [1, -34],
        shadowSize: [41, 41]
    });

    function normalizeCenter(c) {
        if (c == null) return defaultCenter;
        if (Array.isArray(c) && c.length >= 2) return [Number(c[0]), Number(c[1])];
        if (typeof c === 'object') {
            var lat = typeof c.lat === 'number' ? c.lat : Number(c.lat);
            var lng = typeof c.lng === 'number' ? c.lng : Number(c.lng);
            if (!Number.isFinite(lng) && c.Ing != null) lng = Number(c.Ing);
            if (!Number.isFinite(lng) && c.Lng != null) lng = Number(c.Lng);
            if (!Number.isFinite(lng) && c.long != null) lng = Number(c.long);
            if (!Number.isFinite(lng) && c.lon != null) lng = Number(c.lon);
            if (Number.isFinite(lat) && Number.isFinite(lng)) return [lat, lng];
        }
        return defaultCenter;
    }

    function invalidateMapSizeSoon() {
        if (!map) return;
        function run() { try { map.invalidateSize(true); } catch (e) {} }
        setTimeout(run, 0);
        setTimeout(run, 100);
        setTimeout(run, 400);
    }

    function escapeHtml(str) {
        var div = document.createElement('div');
        div.appendChild(document.createTextNode(str || ''));
        return div.innerHTML;
    }

    function escapeAttr(str) {
        return String(str || '')
            .replace(/&/g, '&amp;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;')
            .replace(/</g, '&lt;');
    }

    window.geoMapViewer = {
        init: function(viewportJSON) {
            if (map) {
                try { map.remove(); } catch (e) {}
                map = null;
                markers = {};
            }
            var viewport = {};
            try { viewport = JSON.parse(viewportJSON); } catch (e) {}
            var v = viewport.view || {};
            if (!v.center && viewport.center != null) {
                v = { center: viewport.center, zoom: viewport.zoom };
            }
            var center = normalizeCenter(v.center);
            var zoom = typeof v.zoom === 'number' ? v.zoom : defaultZoom;

            map = L.map('map', {
                center: center,
                zoom: zoom,
                zoomControl: false,
                attributionControl: false
            });

            L.tileLayer(tileURL, { maxZoom: 19 }).addTo(map);
            invalidateMapSizeSoon();
        },

        loadMarkers: function(markersJSON) {
            if (!map) return;
            var list = [];
            try { list = JSON.parse(markersJSON); } catch (e) {}
            for (var k in markers) {
                try { map.removeLayer(markers[k]); } catch (e) {}
            }
            markers = {};

            list.forEach(function(pin) {
                var nid = pin.noteId;
                var m = L.marker([pin.lat, pin.lng], { icon: defaultIcon }).addTo(map);
                var popupHtml = '<a href="#" class="trinote-geo-open-note" data-note-id="' + escapeAttr(nid) + '" style="-webkit-tap-highlight-color:transparent;text-decoration:underline;font-weight:600;">' + escapeHtml(pin.title) + '</a>';
                m.bindPopup(popupHtml);
                m._trinoteNoteId = nid;
                markers[nid] = m;
                m.on('popupopen', function() {
                    var el = m.getPopup() && m.getPopup().getElement();
                    if (!el) return;
                    var link = el.querySelector('.trinote-geo-open-note');
                    if (!link) return;
                    link.onclick = function(e) {
                        e.preventDefault();
                        if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.geoMapViewerOpenNote) {
                            window.webkit.messageHandlers.geoMapViewerOpenNote.postMessage(nid);
                        }
                    };
                });
            });

            if (list.length > 0) {
                var group = L.featureGroup(Object.values(markers));
                map.fitBounds(group.getBounds().pad(0.15));
            }
            invalidateMapSizeSoon();
        }
    };
})();

// Must run after Leaflet loads — Swift waits for this before calling geoMapViewer.init (same pattern as mindmap-viewer).
try {
    if (typeof L !== 'undefined' && window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.geoMapViewerReady) {
        window.webkit.messageHandlers.geoMapViewerReady.postMessage('ready');
    }
} catch (e) {}
</script>
</body>
</html>
