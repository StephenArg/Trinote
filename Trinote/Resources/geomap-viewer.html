<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<link rel="stylesheet" href="vendor/maplibre-gl.css">
<link rel="stylesheet" href="geomap-boxicons.css">
<style>
.icon-glyph-probe {
    position: absolute;
    visibility: hidden;
    pointer-events: none;
}
</style>
<script src="vendor/maplibre-gl.js"></script>
<script src="vendor/gpx.js"></script>
<script src="vendor/geomap-marker-images.js"></script>
<script src="vendor/geomap-core.js"></script>
<style>
@font-face {
    font-family: "boxicons";
    font-weight: normal;
    font-style: normal;
    src: url("Fonts/boxicons.ttf") format("truetype");
}
* { margin: 0; padding: 0; -webkit-touch-callout: none; }
html, body { width: 100%; height: 100%; overflow: hidden; touch-action: none; position: relative; }
#map { width: 100%; height: 100%; position: absolute; top: 0; left: 0; right: 0; bottom: 0; }
</style>
</head>
<body>
<div id="map"></div>
<script>
(function() {
    window.geoMapViewer = TrinoteGeoMap.createEngine({ readOnly: true, apiName: 'geoMapViewer' });
})();

try {
    if (typeof maplibregl !== 'undefined' && window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.geoMapViewerReady) {
        window.webkit.messageHandlers.geoMapViewerReady.postMessage('ready');
    }
} catch (e) {}
</script>
</body>
</html>
