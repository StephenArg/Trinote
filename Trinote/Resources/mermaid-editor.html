<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=10.0, user-scalable=yes">
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
        width: 100%; height: 100%;
        overflow: hidden;
        background: transparent;
    }
    #container {
        width: 100%; height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: auto;
        -webkit-overflow-scrolling: touch;
    }
    #diagram {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 12px;
        width: 100%;
        height: 100%;
    }
    #diagram svg {
        display: block;
        max-width: 100%;
        max-height: 100%;
        object-fit: contain;
    }
    #error {
        color: #e55;
        font-family: -apple-system, system-ui, sans-serif;
        font-size: 13px;
        padding: 12px 16px;
        white-space: pre-wrap;
        position: fixed;
        bottom: 0; left: 0; right: 0;
        background: rgba(0,0,0,0.06);
        display: none;
        z-index: 10;
    }
    @media (prefers-color-scheme: dark) {
        #error { background: rgba(255,255,255,0.08); }
    }
    #loading {
        font-family: -apple-system, system-ui, sans-serif;
        color: #888;
        font-size: 15px;
        text-align: center;
    }
</style>
</head>
<body>
<div id="container">
    <div id="loading">Rendering diagram…</div>
    <div id="diagram"></div>
</div>
<div id="error"></div>

<script type="module">
import mermaid from 'https://esm.sh/mermaid@11/dist/mermaid.esm.min.mjs';

const isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
mermaid.initialize({
    startOnLoad: false,
    theme: isDark ? 'dark' : 'default',
    securityLevel: 'strict',
    fontFamily: '-apple-system, system-ui, sans-serif'
});

let renderCounter = 0;

window.mermaidEditor = {
    async render(source) {
        const loadEl = document.getElementById('loading');
        const diagEl = document.getElementById('diagram');
        const errEl  = document.getElementById('error');
        const thisRender = ++renderCounter;

        if (!source || !source.trim()) {
            loadEl.style.display = '';
            loadEl.textContent = 'Start typing a Mermaid diagram…';
            diagEl.innerHTML = '';
            errEl.style.display = 'none';
            return;
        }

        try {
            const id = 'mermaid-graph-' + thisRender;
            const { svg } = await mermaid.render(id, source);
            if (thisRender !== renderCounter) return;
            loadEl.style.display = 'none';
            diagEl.innerHTML = svg;
            errEl.style.display = 'none';
        } catch (e) {
            if (thisRender !== renderCounter) return;
            loadEl.style.display = 'none';
            errEl.style.display = 'block';
            errEl.textContent = e.message || String(e);
        }
    }
};

try {
    window.webkit.messageHandlers.mermaidEditorReady.postMessage('ready');
} catch(e) {}
</script>
</body>
</html>
